p(<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>











<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 2: Nhận Diện Hình Ảnh Nhạy Cao</title>
    
    <!-- Nạp thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Thanh hiển thị trạng thái Khối 2 */
        #block2-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #ffcc00;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            pointer-events: none;
            width: 85%;
            max-width: 350px;
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- TRẠNG THÁI HIỂN THỊ KHỐI 2 -->
    <div id="block2-status">⏳ [KHỐI 2] Đang nạp dữ liệu nhận diện...</div>

    <!-- KHUNG CẢNH AR (TỐI ƯU ĐỘ NHẠY TỐI ĐA) -->
    <!-- Mẹo tăng độ nhạy: filterMinCF: 0.0001, filterBeta: 0.001, missTolerance: 5 -->
    <a-scene 
            <!-- KHUNG CẢNH AR (TỐI ƯU ĐỘ NHẠY VÀ THỜI GIAN CHỜ) -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; warmupTolerance: 10; missTolerance: 10;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- VÙNG NHẬN DIỆN MẪU (Target Index: 0) -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-0">
            
            <!-- Khung viền Neon màu đỏ xuất hiện khi bắt trúng hình -->
            <a-ring 
                radius-inner="0.45" 
                radius-outer="0.5" 
                color="#00ffcc" 
                material="side: double" 
                position="0 0 0.01"
                animation="property: rotation; to: 0 0 360; loop: true; dur: 2000; easing: linear">
            </a-ring>

            <a-circle color="#00ffcc" radius="0.08" position="0 0 0.01"></a-circle>

        </a-entity>
    </a-scene>

    <!-- LOGIC NHẬN DIỆN KHỐI 2 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("block2-status");
            const sceneEl = document.querySelector("#ar-scene");
            const targetEl = document.getElementById("target-0");

            // 1. Khi dữ liệu AR nạp xong
            sceneEl.addEventListener("loaded", function () {
                statusEl.innerText = "❌ KHÔNG THẤY (Đang quét...)";
                statusEl.style.borderColor = "#ff3366";
                statusEl.style.color = "#ff3366";
                statusEl.style.boxShadow = "0 0 15px rgba(255, 51, 102, 0.4)";
            });

            // 2. KHI TÌM THẤY HÌNH (SO SÁNH KHỚP VỚI TARGETS.MIND)
            targetEl.addEventListener("targetFound", function () {
                statusEl.innerText = "🟢 OK! ĐÃ THẤY HÌNH MẪU";
                statusEl.style.borderColor = "#00ffcc";
                statusEl.style.color = "#00ffcc";
                statusEl.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.8)";
            });

            // 3. KHI MẤT DẤU HÌNH
            targetEl.addEventListener("targetLost", function () {
                statusEl.innerText = "❌ KHÔNG THẤY";
                statusEl.style.borderColor = "#ff3366";
                statusEl.style.color = "#ff3366";
                statusEl.style.boxShadow = "0 0 15px rgba(255, 51, 102, 0.4)";
            });
        });
    </script>

</body>
</html>



























<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>



















<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 4: Video AR 360 Xoay Liên Tục</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #block4-ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            color: #00ffcc;
            font-family: sans-serif;
            font-size: 13px;
            border: 1px solid #00ffcc;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block4-ui">
        🎬 KHỐI 4: Video AR 360° đang xoay...
    </div>

    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <!-- KAI BÁO TÀI NGUYÊN VIDEO (ASSETS) -->
        <a-assets>
            <!-- Bạn có thể thay src bằng đường dẫn file video.mp4 local của bạn -->
            <video id="ar-video" 
                   src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   webkit-playsinline 
                   playsinline>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- KHI QUÉT TRÚNG TARGET 0 -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            
            <!-- VIDEO XOAY 360° DẠNG HÌNH TRỤ (CYLINDER) 
                 - radius: Bán kính vòng xoay 360
                 - animation: Lệnh xoay tròn liên tục 360 độ (10 giây/vòng)
            -->
            <a-cylinder 
                src="#ar-video" 
                position="0 0.5 0" 
                radius="1.2" 
                height="1" 
                open-ended="true" 
                side="double"
                rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-cylinder>

            <!-- TÙY CHỌN DẠNG CẦU (SPHERE 360°) - Mở comment bên dưới nếu muốn video bọc thành quả cầu
            <a-sphere 
                src="#ar-video" 
                position="0 0.5 0" 
                radius="1" 
                rotation="0 0 0"
                material="side: double"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            </a-sphere> 
            -->

        </a-entity>
    </a-scene>

    <script>
        // Xử lý tự động Phát/Dừng Video khi quét thấy Target (Tránh tốn Pin/RAM)
        document.addEventListener("DOMContentLoaded", function () {
            const video = document.getElementById("ar-video");
            const targetEntity = document.getElementById("target-entity");

            // Phát video khi thấy Target
            targetEntity.addEventListener("targetFound", () => {
                video.play().catch(e => console.log("Cần tương tác người dùng để phát Audio:", e));
            });

            // Tạm dừng video khi mất Target
            targetEntity.addEventListener("targetLost", () => {
                video.pause();
            });

            // Kích hoạt âm thanh sau lần chạm đầu tiên (Do chính sách trình duyệt)
            window.addEventListener("click", () => {
                if (video.paused) {
                    video.play();
                }
            }, { once: true });
        });
    </script>

</body>
</html>
