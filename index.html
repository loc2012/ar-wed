<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Chờ Rọi Mẫu</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #instruction {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            border: 1px solid #00ffcc;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="instruction">📸 Rọi camera vào hình vẽ trong tập...</div>

    <!-- Tắt hoàn toàn VR UI để không bị đen màn hình -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Khối lập phương quay ở tâm -->
            <a-box position="0 0 0.25" material="color: #4CC3D9; wireframe: true" scale="0.3 0.3 0.3"
                   animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
            </a-box>
            <a-circle color="red" radius="0.1" position="0 0 0.01"></a-circle>
        </a-entity>

    </a-scene>

</body>
</html>
