<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video VR Box</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        /* Thanh công cụ chọn file cố định phía trên */
        #ui-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 15px;
            border-radius: 25px;
            border: 2px solid #00ffcc;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 10px #00ffcc;
        }

        .btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="ui-container">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 1. Chọn Video MP4</button>
        <button class="btn" id="play-btn">▶️ 2. Mở Xem Phim</button>
        <input type="file" id="file-input" accept="video/mp4,video/*">
    </div>

    <!-- Khai báo thẻ video chuẩn AR -->
    <a-assets>
        <video id="ar-video" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="precision: low; antialias: false; colorManagement: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <!-- Tấm nền màn hình video 3D -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
        </a-entity>

    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const fileInput = document.getElementById('file-input');
        const playBtn = document.getElementById('play-btn');
        const target = document.getElementById('target-entity');

        // BẮT BỘ ĐỆM TẢI FILE CỦA ĐIỆN THOẠI
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    video.src = event.target.result;
                    video.load();
                    playBtn.innerText = "⚡ Bấm Đây Để Bật Tiếng";
                    playBtn.style.background = "#ff0055";
                    playBtn.style.color = "#fff";
                };
                reader.readAsDataURL(file); // Chuyển file thành chuỗi DataURL trực tiếp để Chrome không chặn
            }
        });

        // BẬT TIẾNG & PHÁT VIDEO
        playBtn.addEventListener('click', function() {
            if (video.src) {
                video.muted = false;
                video.play();
                playBtn.innerText = "✅ ĐÃ SẴN SÀNG!";
                playBtn.style.background = "#00ffcc";
                playBtn.style.color = "#000";
            } else {
                alert("Bạn phải chọn Video (Nút số 1) trước đã nhé!");
            }
        });

        // TỰ ĐỘNG PHÁT KHI SOI VÀO BÌA CARTON
        target.addEventListener("targetFound", () => { 
            if (video.src) video.play(); 
        });
        target.addEventListener("targetLost", () => { 
            if (video.src) video.pause(); 
        });
    </script>
</body>
</html>
