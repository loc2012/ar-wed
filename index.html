<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Khối 3 - Nhận diện xanh sáng tối</title>

    <!-- KHỐI 3 KHÔNG TẠO CAMERA RIÊNG -->
    <!-- Chỉ xử lý hình ảnh camera mà MindAR đang sử dụng -->

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* Canvas xử lý màu */
        #green-detection-canvas {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 99990;
            pointer-events: none;
        }

        /* Chấm đỏ */
        #red-dot {
            position: fixed;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: red;
            border: 4px solid white;

            box-shadow:
                0 0 15px red,
                0 0 30px red;

            transform: translate(-50%, -50%);

            z-index: 999999;

            display: none;
            pointer-events: none;
        }

        /* Trạng thái */
        #green-status {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            z-index: 999999;

            min-width: 260px;

            padding: 12px 18px;

            border-radius: 15px;

            background: rgba(0,0,0,.85);

            color: white;

            text-align: center;

            font-size: 14px;
            font-weight: bold;

            border: 2px solid #555;

            box-shadow: 0 0 15px rgba(0,0,0,.5);
        }
    </style>
</head>

<body>

    <!-- CANVAS XỬ LÝ MÀU -->
    <canvas id="green-detection-canvas"></canvas>

    <!-- CHẤM ĐỎ -->
    <div id="red-dot"></div>

    <!-- TRẠNG THÁI -->
    <div id="green-status">
        🔍 Đang tìm màu xanh...
    </div>


<script>

    /* =========================================================
       KHỐI 3
       NHẬN DIỆN MÀU XANH
       
       QUAN TRỌNG:
       Không gọi getUserMedia()
       Không tạo camera mới.
       
       Khối này chỉ tìm video mà MindAR đã tạo.
    ========================================================= */


    const canvas =
        document.getElementById("green-detection-canvas");

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });

    const redDot =
        document.getElementById("red-dot");

    const greenStatus =
        document.getElementById("green-status");


    /* =========================================================
       TÌM VIDEO CAMERA CỦA MINDAR
    ========================================================= */

    function findCameraVideo() {

        const videos =
            document.querySelectorAll("video");

        for (const video of videos) {

            if (
                video.readyState >=
                HTMLMediaElement.HAVE_CURRENT_DATA
            ) {

                return video;
            }
        }

        return null;
    }


    /* =========================================================
       NHẬN DIỆN XANH

       Không dùng brightness cố định.

       Điều này rất quan trọng:

       XANH SÁNG
       XANH TỐI
       XANH BỊ BÓNG
       XANH HƠI XỈN

       đều có thể được nhận.
    ========================================================= */

    function isGreen(r, g, b) {

        const sum = r + g + b;

        if (sum < 12) {
            return false;
        }


        /* -----------------------------------------------------
           1. GREEN DOMINANCE

           G phải nổi bật hơn R và B.

           Dùng tỷ lệ thay vì brightness tuyệt đối.
        ----------------------------------------------------- */

        const greenRatio =
            g / (sum + 1);

        const redRatio =
            r / (sum + 1);

        const blueRatio =
            b / (sum + 1);


        /*
           Với màu xanh thật:

           greenRatio thường cao hơn
           redRatio và blueRatio.
        */

        const greenDominant =
            greenRatio > redRatio * 1.12 &&
            greenRatio > blueRatio * 1.12;


        if (!greenDominant) {
            return false;
        }


        /* -----------------------------------------------------
           2. GREEN INDEX

           Công thức:

           2G - R - B

           Sau đó chuẩn hóa theo tổng RGB.

           Ưu điểm:
           không phụ thuộc mạnh vào độ sáng.

           Ví dụ:

           xanh sáng:
           40, 180, 60

           xanh tối:
           5, 35, 10

           cả hai vẫn có thể cho chỉ số xanh tốt.
        ----------------------------------------------------- */

        const greenIndex =
            (2 * g - r - b) /
            (sum + 1);


        /*
           Ngưỡng thấp để bắt được xanh tối.

           Nhưng vẫn đủ cao để giảm nhận nhầm
           màu xám.
        */

        const strongGreen =
            greenIndex > 0.55;


        if (!strongGreen) {
            return false;
        }


        /* -----------------------------------------------------
           3. CHROMA

           Kiểm tra màu có thực sự có sắc
           hay chỉ là màu xám/trắng.
        ----------------------------------------------------- */

        const maxRGB =
            Math.max(r, g, b);

        const minRGB =
            Math.min(r, g, b);

        const chroma =
            maxRGB - minRGB;


        /*
           Không bắt chroma quá cao.

           Chỉ cần có sự khác biệt giữa G
           và R/B là được.
           
           Điều này giúp xanh tối vẫn qua.
        */

        const enoughColorDifference =
            chroma >= 4;


        if (!enoughColorDifference) {
            return false;
        }


        /* -----------------------------------------------------
           4. LOẠI MỘT SỐ MÀU VÀNG

           Nếu R gần bằng G quá nhiều,
           có thể là vàng.

           Với xanh thật:
           G thường vượt R rõ hơn.
        ----------------------------------------------------- */

        const notYellow =
            g > r * 1.05;


        if (!notYellow) {
            return false;
        }


        return true;
    }


    /* =========================================================
       PHÁT HIỆN XANH
    ========================================================= */

    function detectGreen() {

        const video =
            findCameraVideo();


        /*
           MindAR chưa tạo video
           thì thử lại.
        */

        if (!video) {

            greenStatus.innerHTML =
                "⏳ Đang chờ camera MindAR...";

            requestAnimationFrame(
                detectGreen
            );

            return;
        }


        if (
            video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {

            requestAnimationFrame(
                detectGreen
            );

            return;
        }


        /* -----------------------------------------------------
           KÍCH THƯỚC XỬ LÝ

           320x240 đủ để xác định vùng xanh
           nhưng nhẹ CPU hơn rất nhiều.
        ----------------------------------------------------- */

        const w = 320;
        const h = 240;


        canvas.width = w;
        canvas.height = h;


        try {

            ctx.drawImage(
                video,
                0,
                0,
                w,
                h
            );

        } catch (error) {

            requestAnimationFrame(
                detectGreen
            );

            return;
        }


        let imageData;

        try {

            imageData =
                ctx.getImageData(
                    0,
                    0,
                    w,
                    h
                );

        } catch (error) {

            requestAnimationFrame(
                detectGreen
            );

            return;
        }


        const data =
            imageData.data;


        let totalX = 0;
        let totalY = 0;

        let count = 0;


        /* =====================================================
           QUÉT PIXEL

           2 pixel lấy 1.

           Nhạy hơn phiên bản cũ.
        ===================================================== */

        for (
            let y = 0;
            y < h;
            y += 2
        ) {

            for (
                let x = 0;
                x < w;
                x += 2
            ) {

                const i =
                    (y * w + x) * 4;


                const r =
                    data[i];

                const g =
                    data[i + 1];

                const b =
                    data[i + 2];


                if (
                    isGreen(r, g, b)
                ) {

                    totalX += x;
                    totalY += y;

                    count++;
                }
            }
        }


        /* =====================================================
           SỐ PIXEL XANH TỐI THIỂU

           Giảm xuống so với bản cũ.

           Vì xanh tối thường có ít pixel
           vượt ngưỡng hơn.
        ===================================================== */

        const MIN_GREEN_PIXELS = 300;


        if (
            count >= MIN_GREEN_PIXELS
        ) {

            /* -------------------------------------------------
               TÂM VÙNG XANH
            ------------------------------------------------- */

            const centerX =
                totalX / count;

            const centerY =
                totalY / count;


            /* -------------------------------------------------
               ĐỔI SANG TỌA ĐỘ MÀN HÌNH
            ------------------------------------------------- */

            const screenX =
                centerX / w *
                window.innerWidth;

            const screenY =
                centerY / h *
                window.innerHeight;


            /* -------------------------------------------------
               CHẤM ĐỎ
            ------------------------------------------------- */

            redDot.style.display =
                "block";

            redDot.style.left =
                screenX + "px";

            redDot.style.top =
                screenY + "px";


            /* -------------------------------------------------
               TRẠNG THÁI
            ------------------------------------------------- */

            greenStatus.innerHTML =
                "🟢 XANH ĐƯỢC PHÁT HIỆN" +
                "<br>" +
                "📍 X: " +
                Math.round(screenX) +
                " | Y: " +
                Math.round(screenY) +
                "<br>" +
                "🔴 Chấm đỏ đang ở tâm vùng xanh";


            greenStatus.style.color =
                "#00ff66";

            greenStatus.style.borderColor =
                "#00ff66";


        } else {

            /* -------------------------------------------------
               KHÔNG CÓ XANH
            ------------------------------------------------- */

            redDot.style.display =
                "none";


            greenStatus.innerHTML =
                "🔴 KHÔNG CÓ MÀU XANH";


            greenStatus.style.color =
                "#ff3366";

            greenStatus.style.borderColor =
                "#ff3366";
        }


        requestAnimationFrame(
            detectGreen
        );
    }


    /* =========================================================
       CHỜ CAMERA MINDAR
    ========================================================= */

    window.addEventListener(
        "load",
        function() {

            /*
               Cho MindAR một chút thời gian
               tạo video camera.
            */

            setTimeout(
                function() {

                    detectGreen();

                },
                500
            );
        }
    );


</script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Video đi theo chấm đỏ</title>

<style>
    body {
        margin: 0;
        background: #222;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .toolbar {
        padding: 15px;
        background: #333;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
    }

    .stage {
        position: relative;
        width: 800px;
        height: 500px;
        margin: 20px auto;
        background: #111;
        border: 2px solid #555;
        overflow: hidden;
    }

    /* VIDEO */
    #video {
        position: absolute;
        width: 300px;
        left: 0;
        top: 0;
        cursor: move;
    }

    /* CHẤM ĐỎ */
    #redPoint {
        position: absolute;
        width: 18px;
        height: 18px;

        background: red;
        border-radius: 50%;

        left: 400px;
        top: 250px;

        transform: translate(-50%, -50%);

        z-index: 20;
        box-shadow: 0 0 8px red;

        pointer-events: none;
    }
</style>
</head>

<body>

<div class="toolbar">

    <!-- DUY NHẤT NÚT NGƯỜI DÙNG CẦN BẤM -->
    <input
        type="file"
        id="fileInput"
        accept="video/*"
    >

</div>


<div class="stage" id="stage">

    <!-- CHẤM ĐỎ -->
    <div id="redPoint"></div>

    <!-- VIDEO -->
    <video
        id="video"
        controls
        playsinline
    ></video>

</div>


<script>

const fileInput =
    document.getElementById("fileInput");

const video =
    document.getElementById("video");

const redPoint =
    document.getElementById("redPoint");

const stage =
    document.getElementById("stage");


// ==================================================
// TẢI VIDEO
// ==================================================

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const url =
        URL.createObjectURL(file);

    video.src = url;

    video.load();

});


// ==================================================
// LẤY TỌA ĐỘ CHẤM ĐỎ
// ==================================================

function getRedPointPosition() {

    const pointRect =
        redPoint.getBoundingClientRect();

    const stageRect =
        stage.getBoundingClientRect();

    const x =
        pointRect.left -
        stageRect.left +
        pointRect.width / 2;

    const y =
        pointRect.top -
        stageRect.top +
        pointRect.height / 2;

    return {
        x: x,
        y: y
    };
}


// ==================================================
// ĐƯA VIDEO ĐI THEO CHẤM ĐỎ
// ==================================================

function followRedPoint() {

    const point =
        getRedPointPosition();

    /*
        Lấy kích thước video
        để tâm video nằm đúng chấm đỏ
    */

    const videoWidth =
        video.offsetWidth;

    const videoHeight =
        video.offsetHeight;


    const x =
        point.x -
        videoWidth / 2;

    const y =
        point.y -
        videoHeight / 2;


    video.style.left =
        x + "px";

    video.style.top =
        y + "px";

}


// ==================================================
// KHI VIDEO ĐƯỢC TẢI XONG
// ==================================================

video.addEventListener("loadedmetadata", function () {

    followRedPoint();

});


// ==================================================
// KÉO CHẤM ĐỎ
// ==================================================

let draggingPoint = false;


redPoint.style.pointerEvents = "auto";

redPoint.addEventListener("mousedown", function () {

    draggingPoint = true;

});


document.addEventListener("mousemove", function (e) {

    if (!draggingPoint) return;


    const rect =
        stage.getBoundingClientRect();


    let x =
        e.clientX -
        rect.left;

    let y =
        e.clientY -
        rect.top;


    /*
        Không cho chấm đỏ
        ra ngoài khung
    */

    x = Math.max(0, Math.min(800, x));
    y = Math.max(0, Math.min(500, y));


    redPoint.style.left =
        x + "px";

    redPoint.style.top =
        y + "px";


    // VIDEO ĐI THEO CHẤM
    followRedPoint();

});


document.addEventListener("mouseup", function () {

    draggingPoint = false;

});

</script>

</body>
</html>
