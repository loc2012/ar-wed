<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>











<!<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 2: Siêu Nhạy & Chống Rung Video</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* THANH THÔNG BÁO TRẠNG THÁI REALTIME */
        #status-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="status-bar">🔍 DẠO CAMERA ĐỂ KÍCH HOẠT...</div>

    <!-- SCENE AR - ÉP CẤU HÌNH SIÊU NHẠY VÀ CHỊU GÓC NGHIÊNG CỰC ĐẠI -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; 
                      autoStart: true; 
                      uiLoading: no; 
                      uiScanning: no;
                      filterMinCF: 0.0000001; 
                      filterBeta: 0.001; 
                      missTolerance: 1000;
                      warmupTolerance: 1;" 
        embedded 
        color-space="sRGB" 
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <!-- Link video phát sẵn (Có thể thay bằng file local hoặc link video của bạn) -->
            <video id="k2-video" 
                   src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TARGET ENTITY -->
        <a-entity mindar-image-target="targetIndex: 0" id="k2-target">
            
            <!-- TẤM BẢNG VIDEO PHÁT NGAY TRÊN HÌNH TARGET -->
            <a-plane 
                id="k2-video-plane"
                src="#k2-video"
                width="1.6" 
                height="0.9" 
                position="0 0 0.05"
                material="shader: flat; side: double;">
            </a-plane>

            <!-- Viền Neon phản quang bao quanh -->
            <a-ring radius-inner="0.82" radius-outer="0.86" color="#00ffcc" position="0 0 0.04"></a-ring>
            
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusBar = document.getElementById("status-bar");
            const target = document.getElementById("k2-target");
            const video = document.getElementById("k2-video");

            let lostTimer = null; // Biến đếm ngược thời gian chờ 3.5 giây

            // 1. KHI PHÁT HIỆN HÌNH (DÙ NGHIÊNG LỚN HAY HƠI GIỐNG)
            target.addEventListener("targetFound", () => {
                // Nếu đang trong thời gian đếm ngược 3.5s mà quét lại trúng -> HỦY NGAY LỆNH TẮT!
                if (lostTimer) {
                    clearTimeout(lostTimer);
                    lostTimer = null;
                }

                // Giữ nguyên video phát bình thường
                video.play().catch(() => {});
                
                statusBar.innerText = "⚡ BẮT DẤU TỐT (GIỮ VIDEO)";
                statusBar.style.borderColor = "#00ffcc";
                statusBar.style.color = "#00ffcc";
                statusBar.style.boxShadow = "0 0 12px rgba(0, 255, 204, 0.8)";
            });

            // 2. KHI MẤT DẤU / RUNG TAY / LỆCH CAMERA
            target.addEventListener("targetLost", () => {
                statusBar.innerText = "⏳ CHỐNG RUNG: GIỮ VIDEO 3.5S...";
                statusBar.style.borderColor = "#ffcc00";
                statusBar.style.color = "#ffcc00";

                // Bắt đầu đếm lùi đúng 3.5 giây (3500 mili giây)
                lostTimer = setTimeout(() => {
                    // Sau 3.5s vẫn không thấy hình thì mới thực sự dừng video
                    video.pause();
                    
                    statusBar.innerText = "🔍 ĐANG QUÉT TÌM HÌNH...";
                    statusBar.style.borderColor = "#ff007f";
                    statusBar.style.color = "#ff007f";
                    statusBar.style.boxShadow = "0 0 12px rgba(255, 0, 127, 0.5)";
                }, 3500); 
            });
        });
    </script>

</body>
</html>



























<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>
