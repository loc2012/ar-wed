<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Test</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
        /* Ép canvas luôn tràn màn hình */
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <!-- Đặt camera ở đây. Chú ý: Cấu hình cực nhẹ để máy cũ không bị văng -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        embedded
        renderer="colorManagement: false; antialias: false;"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="vid" loop playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-video src="#vid" width="1" height="0.56" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        // Thêm nút bấm thủ công để "kích hoạt" camera nếu nó bị đen
        window.addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            // Cố gắng bắt sự kiện của A-Frame để kích hoạt lại render
            scene.resize();
        });

        // Xử lý video
        const v = document.getElementById('vid');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'video/*';
        fileInput.style.position = 'fixed'; fileInput.style.top = '10px'; fileInput.style.zIndex = '9999';
        document.body.appendChild(fileInput);

        fileInput.onchange = (e) => {
            v.src = URL.createObjectURL(e.target.files[0]);
            v.play();
        };
    </script>
</body>
</html>
