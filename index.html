<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>







































<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>


















<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Core Tracking (Chống Tranh Cam)</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: sans-serif;
        }

        /* Cam phụ & Video nguồn chạy ẩn */
        #raw-video { display: none; }

        /* CANVAS HỢP NHẤT KHỐI 3 (ĐẦU RA CHO KHỐI 2) */
        #khoi3-output-canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* UI PANEL PANEL DƯỚI MÀN HÌNH */
        #ui-panel {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ffcc;
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ffcc;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            white-space: nowrap;
        }

        #size-slider {
            width: 80px;
            accent-color: #00ffcc;
            cursor: pointer;
        }

        #btn-download {
            background: #00ffcc; color: #000;
            border: none; padding: 5px 10px;
            border-radius: 12px; font-weight: bold; font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <span id="status-text">🔍 ĐANG LẤY CAM KHỐI 1...</span>
        <span>| Zoom:</span>
        <input type="range" id="size-slider" min="0.5" max="4.0" step="0.1" value="1.5">
        <button id="btn-download">💾 Tải khoi3.html</button>
    </div>

    <!-- VIDEO NGUỒN ĐỂ ĐÈ LÊN ĐÈN -->
    <video id="raw-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" autoplay loop muted playsinline></video>

    <!-- CANVAS ĐẦU RA CỦA KHỐI 3 -->
    <canvas id="khoi3-output-canvas"></canvas>

    <script>
        let webcamElement = null; // Sẽ tự động liên kết với Cam của Khối 1
        const sourceVideo = document.getElementById('raw-video');
        const canvas = document.getElementById('khoi3-output-canvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('size-slider');
        const statusText = document.getElementById('status-text');
        const btnDownload = document.getElementById('btn-download');

        // NÚT TẢI FILE KHOI3
        btnDownload.addEventListener('click', () => {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'khoi3.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // TỰ ĐỘNG TÌM VÀ DÙNG CHUNG CAM CỦA KHỐI 1 (KHÔNG TỰ BẬT CAM NỮA)
        function findAndShareCamera() {
            // Tìm thẻ <video> đang phát của Khối 1 trên trang
            const allVideos = document.querySelectorAll('video');
            for (let vid of allVideos) {
                if (vid.id !== 'raw-video' && (vid.srcObject || vid.currentTime > 0)) {
                    webcamElement = vid;
                    statusText.innerText = "✅ ĐÃ KẾT NỐI CAM KHỐI 1";
                    return true;
                }
            }
            return false;
        }

        // VÒNG LẶP PHÂN TÍCH VÀ ĐÈ VIDEO (KHỐI 3)
        function processKhoi3() {
            if (!webcamElement) {
                findAndShareCamera(); // Tìm Cam Khối 1 nếu chưa thấy
            }

            if (webcamElement && webcamElement.readyState >= 2) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // 1. Lấy khung hình từ Cam Khối 1 vẽ lên Canvas Khối 3
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(webcamElement, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();

                // 2. Phân tích điểm màu Xanh
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                let sumX = 0, sumY = 0, count = 0;
                let step = 8;

                for (let i = 0; i < data.length; i += 4 * step) {
                    let r = data[i], g = data[i+1], b = data[i+2];

                    if (g > 80 && g > r * 1.25 && g > b * 1.1) {
                        let pixelIndex = i / 4;
                        let x = pixelIndex % canvas.width;
                        let y = Math.floor(pixelIndex / canvas.width);
                        sumX += x;
                        sumY += y;
                        count++;
                    }
                }

                // 3. Đè Video vào đúng điểm màu Xanh
                if (count > 3) {
                    let avgX = sumX / count;
                    let avgY = sumY / count;

                    let scaleMultiplier = parseFloat(slider.value);
                    let videoW = Math.min(Math.max(Math.sqrt(count * step) * 8 * scaleMultiplier, 100), 800);
                    let videoH = videoW * (9 / 16);

                    let drawX = avgX - (videoW / 2);
                    let drawY = avgY - (videoH / 2);

                    if (sourceVideo.readyState >= 2) {
                        ctx.drawImage(sourceVideo, drawX, drawY, videoW, videoH);
                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(drawX, drawY, videoW, videoH);
                    }

                    statusText.innerText = "⚡ KHÓA ĐÈN (" + Math.round(videoW) + "px)";
                    statusText.style.color = "#00ffcc";
                } else {
                    statusText.innerText = "🔍 ĐANG TÌM ĐÈN...";
                    statusText.style.color = "#ff0055";
                }
            }

            requestAnimationFrame(processKhoi3);
        }

        // Bắt đầu vòng lặp xử lý
        requestAnimationFrame(processKhoi3);
    </script>
</body>
</html>
