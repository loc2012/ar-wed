<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3 - VR Split & Green Detection Optimized</title>
    
    <!-- Các thư viện AR / VR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Nút chuyển đổi VR */
        #block3-ui {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Lớp nhân bản mắt phải */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }

        /* Canvas xử lý pixel ẩn */
        #green-detection-canvas {
            display: none;
        }

        /* Chấm đỏ theo dõi tâm vùng xanh */
        #red-dot {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: red;
            border: 3px solid white;
            box-shadow: 0 0 15px red, 0 0 25px red;
            transform: translate(-50%, -50%);
            z-index: 999999;
            display: none;
            pointer-events: none;
            will-change: left, top;
        }

        /* Bảng hiển thị thông số */
        #green-status {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 999999;
            min-width: 250px;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid #555;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- CONTROL CHIA ĐÔI MÀN HÌNH -->
    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE AR (MINDAR & AFRAME) -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- LỚP HIỂN THỊ MẮT PHẢI (CHIA ĐÔI VR) -->
    <div id="right-eye-overlay"></div>

    <!-- CÁC THÀNH PHẦN NHẬN DIỆN MÀU XANH -->
    <canvas id="green-detection-canvas" width="320" height="240"></canvas>
    <div id="red-dot"></div>
    <div id="green-status">🔍 Đang tìm camera MindAR...</div>

    <script>
        /* =========================================================
           1. XỬ LÝ SỰ KIỆN CHIA ĐÔI MÀN HÌNH VR
        ========================================================= */
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;
                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }
                window.dispatchEvent(new Event('resize'));
            });
        });

        /* =========================================================
           2. THUẬT TOÁN TỐI ƯU NHẬN DIỆN MÀU XANH (FPS CAO)
        ========================================================= */
        const W = 320;
        const H = 240;
        const MIN_GREEN_PIXELS = 300;

        const canvas = document.getElementById("green-detection-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true, alpha: false });
        const redDot = document.getElementById("red-dot");
        const greenStatus = document.getElementById("green-status");

        let cachedVideo = null;

        // Lưu tạm thẻ video của MindAR để tránh gọi DOM lặp lại
        function getCameraVideo() {
            if (cachedVideo && cachedVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                return cachedVideo;
            }
            const videos = document.querySelectorAll("video");
            for (let i = 0; i < videos.length; i++) {
                if (videos[i].readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    cachedVideo = videos[i];
                    return cachedVideo;
                }
            }
            return null;
        }

        // Kiểm tra màu xanh (Giữ chính xác 100% logic thuật toán)
        function isGreen(r, g, b) {
            const sum = r + g + b;
            if (sum < 12) return false;

            const sumAdj = sum + 1;
            const greenRatio = g / sumAdj;
            const redRatio = r / sumAdj;
            const blueRatio = b / sumAdj;

            if (greenRatio <= redRatio * 1.12 || greenRatio <= blueRatio * 1.12) {
                return false;
            }

            const greenIndex = (2 * g - r - b) / sumAdj;
            if (greenIndex <= 0.55) return false;

            const maxRGB = Math.max(r, g, b);
            const minRGB = Math.min(r, g, b);
            if ((maxRGB - minRGB) < 4) return false;

            if (g <= r * 1.05) return false;

            return true;
        }

        // Vòng lặp nhận diện chạy bằng requestAnimationFrame
        function detectGreenLoop() {
            const video = getCameraVideo();

            if (!video) {
                greenStatus.innerHTML = "⏳ Đang chờ camera MindAR...";
                requestAnimationFrame(detectGreenLoop);
                return;
            }

            // Vẽ frame ảnh sang canvas ẩn
            ctx.drawImage(video, 0, 0, W, H);
            
            const imageData = ctx.getImageData(0, 0, W, H);
            const data = imageData.data;

            let totalX = 0;
            let totalY = 0;
            let count = 0;

            // Quét pixel với bước nhảy 2 (Tăng tốc xử lý CPU)
            for (let y = 0; y < H; y += 2) {
                const rowOffset = y * W;
                for (let x = 0; x < W; x += 2) {
                    const i = (rowOffset + x) << 2; // Tương đương phép nhân 4

                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    if (isGreen(r, g, b)) {
                        totalX += x;
                        totalY += y;
                        count++;
                    }
                }
            }

            // Cập nhật vị trí chấm đỏ và thông báo
            if (count >= MIN_GREEN_PIXELS) {
                const centerX = totalX / count;
                const centerY = totalY / count;

                const screenX = (centerX / W) * window.innerWidth;
                const screenY = (centerY / H) * window.innerHeight;

                redDot.style.display = "block";
                redDot.style.left = screenX + "px";
                redDot.style.top = screenY + "px";

                greenStatus.innerHTML = `🟢 XANH ĐƯỢC PHÁT HIỆN<br>📍 X: ${Math.round(screenX)} | Y: ${Math.round(screenY)}<br>🔴 Chấm đỏ đang ở tâm vùng xanh`;
                greenStatus.style.color = "#00ff66";
                greenStatus.style.borderColor = "#00ff66";
            } else {
                redDot.style.display = "none";
                greenStatus.innerHTML = "🔴 KHÔNG CÓ MÀU XANH";
                greenStatus.style.color = "#ff3366";
                greenStatus.style.borderColor = "#ff3366";
            }

            requestAnimationFrame(detectGreenLoop);
        }

        // Khai hỏa khi trang web đã tải xong
        window.addEventListener("load", function () {
            setTimeout(detectGreenLoop, 500);
        });
    </script>
</body>
</html>
