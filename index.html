<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bật Camera HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        video {
            width: 100%;
            max-width: 500px;
            height: auto;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #000;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2>Ứng dụng bật Camera</h2>
    
    <!-- Ô hiển thị video từ camera -->
    <video id="webcam" autoplay playsinline></video>
    
    <!-- Nút bấm bật camera -->
    <button onclick="startCamera()">Bật Camera</button>

    <script>
        async function startCamera() {
            try {
                // Yêu cầu quyền truy cập Camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: false 
                });
                
                // Gán luồng camera vào thẻ <video>
                const videoElement = document.getElementById('webcam');
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Lỗi khi mở camera: ", error);
                alert("Không thể mở camera. Vui lòng kiểm tra quyền truy cập!");
            }
        }
    </script>

</body>
</html>















































<script>
  AFRAME.registerComponent('mirror-x', {
    init: function () {
      // Nhân bản entity hiện tại
      let clone = this.el.cloneNode(true);
      
      // Đảo ngược vị trí theo trục X
      let pos = this.el.getAttribute('position');
      clone.setAttribute('position', { x: -pos.x, y: pos.y, z: pos.z });
      
      // Đảo ngược xoay theo trục Y/Z để đối xứng hoàn toàn
      let rot = this.el.getAttribute('rotation');
      clone.setAttribute('rotation', { x: rot.x, y: -rot.y, z: -rot.z });

      // Đưa vật thể nhân bản vào scene
      this.el.sceneEl.appendChild(clone);
    }
  });
</script>

<!-- Áp dụng vào vật thể ở một bên (VD: bên trái x = -2) -->
<a-box position="-2 1.5 -3" color="#4CC3D9" mirror-x></a-box>
