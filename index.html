<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống VR & Nhận Diện Màu Xanh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Controls Area */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
        }
        .btn-primary:hover { background-color: #0369a1; }

        .btn-vr {
            background-color: #8b5cf6;
            color: white;
        }
        .btn-vr:hover { background-color: #7c3aed; }

        /* Display Container */
        .viewport-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 480px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        .screen-view {
            flex: 1;
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screen-view:nth-child(2) {
            display: none; /* Trạng thái mặc định: Chưa chia đôi */
            border-left: 2px solid #475569;
        }

        .viewport-container.split-screen .screen-view:nth-child(2) {
            display: flex; /* Hiện màn hình thứ 2 khi bật VR Split */
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video {
            display: none; /* Camera chạy ẩn dưới nền để xử lý Canvas */
        }

        /* Dashboard & Metrics Overlay */
        .dashboard {
            width: 100%;
            max-width: 1000px;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .card {
            background-color: #1e293b;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-on { background-color: #059669; color: #ecfdf5; }
        .badge-off { background-color: #dc2626; color: #fef2f2; }
    </style>
</head>
<body>

    <h1>Hệ Thống Camera VR Tracking Màu Xanh</h1>

    <div class="controls">
        <button id="btnCam" class="btn-primary" onclick="toggleCamera()">Bật Camera</button>
        <button id="btnVR" class="btn-vr" onclick="toggleVR()">Chia Đôi Màn Hình (VR): TẮT</button>
    </div>

    <!-- Màn hình hiển thị chính -->
    <div id="viewport" class="viewport-container">
        <!-- Màn hình Mắt Trái / Đơn -->
        <div class="screen-view">
            <canvas id="canvasLeft"></canvas>
        </div>
        <!-- Màn hình Mắt Phải (Chế độ VR Chia Đôi) -->
        <div class="screen-view">
            <canvas id="canvasRight"></canvas>
        </div>
    </div>

    <!-- Bảng thông số real-time -->
    <div class="dashboard">
        <div class="card">
            <div class="card-title">1. Trạng thái Camera</div>
            <div class="card-value"><span id="stCam" class="status-badge badge-off">Chưa Bật</span></div>
        </div>

        <div class="card">
            <div class="card-title">2. Chia Đôi Màn Hình</div>
            <div class="card-value"><span id="stVR" class="status-badge badge-off">Chưa</span></div>
        </div>

        <div class="card">
            <div class="card-title">3. Phát Hiện Màu Xanh</div>
            <div class="card-value"><span id="stGreen" class="status-badge badge-off">Chưa</span></div>
        </div>

        <div class="card">
            <div class="card-title">4. Kích Thước Vùng Xanh</div>
            <div class="card-value" id="valSize">0 x 0 px</div>
        </div>

        <div class="card">
            <div class="card-title">5. Tọa Độ Chấm Đỏ</div>
            <div class="card-value" id="valCoords">X: - | Y: -</div>
        </div>
    </div>

    <video id="webcamVideo" autoplay playsinline></video>

    <script>
        let video = document.getElementById('webcamVideo');
        let canvasL = document.getElementById('canvasLeft');
        let ctxL = canvasL.getContext('2d', { willReadFrequently: true });
        let canvasR = document.getElementById('canvasRight');
        let ctxR = canvasR.getContext('2d');

        let isCamOn = false;
        let isSplitVR = false;
        let animationFrameId = null;

        // Các thành phần UI
        const stCam = document.getElementById('stCam');
        const stVR = document.getElementById('stVR');
        const stGreen = document.getElementById('stGreen');
        const valSize = document.getElementById('valSize');
        const valCoords = document.getElementById('valCoords');
        const viewportContainer = document.getElementById('viewport');

        // Bật / Tắt Camera
        async function toggleCamera() {
            if (isCamOn) {
                stopCamera();
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                    });
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        canvasL.width = canvasR.width = video.videoWidth;
                        canvasL.height = canvasR.height = video.videoHeight;
                        isCamOn = true;
                        
                        stCam.innerText = "Đã Bật";
                        stCam.className = "status-badge badge-on";
                        document.getElementById('btnCam').innerText = "Tắt Camera";

                        processVideoFrame();
                    };
                } catch (err) {
                    alert("Không thể truy cập camera! Vui lòng cho phép quyền sử dụng camera.");
                    console.error(err);
                }
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            isCamOn = false;
            stCam.innerText = "Chưa Bật";
            stCam.className = "status-badge badge-off";
            document.getElementById('btnCam').innerText = "Bật Camera";
            
            resetMetrics();
        }

        // Bật / Tắt Chế độ Chia Đôi Màn Hình (VR)
        function toggleVR() {
            isSplitVR = !isSplitVR;
            if (isSplitVR) {
                viewportContainer.classList.add('split-screen');
                stVR.innerText = "Có (Đã Bật)";
                stVR.className = "status-badge badge-on";
                document.getElementById('btnVR').innerText = "Chia Đôi Màn Hình (VR): BẬT";
            } else {
                viewportContainer.classList.remove('split-screen');
                stVR.innerText = "Chưa";
                stVR.className = "status-badge badge-off";
                document.getElementById('btnVR').innerText = "Chia Đôi Màn Hình (VR): TẮT";
            }
        }

        // Xử lý Frame & Nhận Diện Màu Xanh Lá
        function processVideoFrame() {
            if (!isCamOn) return;

            // Vẽ khung hình từ Video lên Canvas Trái
            ctxL.drawImage(video, 0, 0, canvasL.width, canvasL.height);
            let frameData = ctxL.getImageData(0, 0, canvasL.width, canvasL.height);
            let data = frameData.data;

            let sumX = 0, sumY = 0, count = 0;
            let minX = canvasL.width, maxX = 0;
            let minY = canvasL.height, maxY = 0;

            // Thuật toán quét điểm ảnh nhận diện sắc độ xanh lá (Green Color Threshold)
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // Điều kiện lọc màu xanh lá nổi bật
                if (g > 80 && g > r * 1.35 && g > b * 1.2) {
                    let pixelIndex = i / 4;
                    let x = pixelIndex % canvasL.width;
                    let y = Math.floor(pixelIndex / canvasL.width);

                    sumX += x;
                    sumY += y;
                    count++;

                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }

            let greenDetected = count > 150; // Ngưỡng tối thiểu 150 điểm ảnh để tránh nhiễu

            if (greenDetected) {
                let centerX = Math.round(sumX / count);
                let centerY = Math.round(sumY / count);
                let widthGreen = maxX - minX;
                let heightGreen = maxY - minY;

                // 1. Vẽ khung bao quanh vùng xanh (Tùy chọn hiển thị)
                ctxL.strokeStyle = "rgba(0, 255, 0, 0.6)";
                ctxL.lineWidth = 2;
                ctxL.strokeRect(minX, minY, widthGreen, heightGreen);

                // 2. Vẽ hình tròn đỏ ở ĐÚNG GIỮA (Tâm) vùng màu xanh
                drawRedDot(ctxL, centerX, centerY);

                // Update thông số lên Bảng điều khiển
                stGreen.innerText = "Có";
                stGreen.className = "status-badge badge-on";
                valSize.innerText = `${widthGreen} x ${heightGreen} px`;
                valCoords.innerText = `X: ${centerX} | Y: ${centerY}`;

                // Nếu bật chế độ VR Split Screen, render lại khung hình sang mắt phải
                if (isSplitVR) {
                    ctxR.drawImage(canvasL, 0, 0);
                }
            } else {
                resetDetectionMetrics();
                if (isSplitVR) {
                    ctxR.drawImage(canvasL, 0, 0);
                }
            }

            animationFrameId = requestAnimationFrame(processVideoFrame);
        }

        // Hàm vẽ chấm tròn đỏ
        function drawRedDot(context, x, y) {
            context.beginPath();
            context.arc(x, y, 12, 0, 2 * Math.PI); // Bán kính 12px
            context.fillStyle = "#ef4444";
            context.fill();
            context.lineWidth = 3;
            context.strokeStyle = "#ffffff";
            context.stroke();
        }

        function resetDetectionMetrics() {
            stGreen.innerText = "Chưa";
            stGreen.className = "status-badge badge-off";
            valSize.innerText = "0 x 0 px";
            valCoords.innerText = "X: - | Y: -";
        }

        function resetMetrics() {
            resetDetectionMetrics();
            ctxL.clearRect(0, 0, canvasL.width, canvasL.height);
            ctxR.clearRect(0, 0, canvasR.width, canvasR.height);
        }
    </script>
</body>
</html>
