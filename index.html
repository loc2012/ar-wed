<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3 - VR Split & Green Detection Smooth</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Nút UI Điều khiển */
        #block3-ui {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG CHỨA TOÀN BỘ SCENE */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* XỬ LÝ CHIA ĐÔI MÀN HÌNH BẰNG CSS DUP DUAL-EYE (KHÔNG DÙNG IFRAME) */
        body.mode-vr-split #vr-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Cấu hình hiển thị chuẩn VR Split */
        body.mode-vr-split .a-canvas {
            width: 50vw !important;
            height: 100vh !important;
            position: absolute !important;
            left: 0 !important;
            top: 0 !important;
        }

        /* Tạo hiệu ứng nhân bản mắt bên phải trực tiếp trên GPU */
        #right-eye-clone {
            display: none;
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 999;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-clone {
            display: block;
        }

        #right-eye-clone canvas {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            right: 0;
            top: 0;
        }

        /* CANVAS ẨN QUÉT MÀU XANH 320x240 */
        #green-detection-canvas {
            display: none;
        }

        /* CHẤM ĐỎ THEO DÕI */
        #red-dot {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: red;
            border: 3px solid white;
            box-shadow: 0 0 15px red, 0 0 25px red;
            transform: translate(-50%, -50%);
            z-index: 999999;
            display: none;
            pointer-events: none;
        }

        /* BẢNG TRẠNG THÁI */
        #green-status {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 999999;
            min-width: 250px;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- NÚT BẬT/TẮT VR -->
    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE VR/AR -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>

        <!-- KHUNG CHỨA MẮT PHẢI VR (DÙNG CANAL REPLICATOR) -->
        <div id="right-eye-clone"></div>
    </div>

    <!-- THÀNH PHẦN QUÉT MÀU XANH -->
    <canvas id="green-detection-canvas" width="320" height="240"></canvas>
    <div id="red-dot"></div>
    <div id="green-status">⏳ Đang chờ camera MindAR...</div>

    <script>
        /* =========================================================
           1. SỰ KIỆN NÚT BẬT CHIA ĐÔI VR
        ========================================================= */
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const rightEye = document.getElementById("right-eye-clone");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Clone canvas thực tế của A-Frame sang mắt phải
                    const originalCanvas = document.querySelector('.a-canvas');
                    if (originalCanvas && rightEye.children.length === 0) {
                        const clonedCanvas = originalCanvas.cloneNode(true);
                        rightEye.appendChild(clonedCanvas);
                    }
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    rightEye.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });

        /* =========================================================
           2. THUẬT TOÁN QUÉT MÀU XANH 320x240 TỐI ƯU FPS
        ========================================================= */
        const W = 320;
        const H = 240;
        const MIN_GREEN_PIXELS = 300;

        const canvas = document.getElementById("green-detection-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const redDot = document.getElementById("red-dot");
        const greenStatus = document.getElementById("green-status");

        let cachedVideo = null;

        function findCameraVideo() {
            if (cachedVideo && cachedVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                return cachedVideo;
            }
            const videos = document.querySelectorAll("video");
            for (let i = 0; i < videos.length; i++) {
                if (videos[i].readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    cachedVideo = videos[i];
                    return cachedVideo;
                }
            }
            return null;
        }

        function isGreen(r, g, b) {
            const sum = r + g + b;
            if (sum < 12) return false;

            const sumAdj = sum + 1;
            const greenRatio = g / sumAdj;
            const redRatio = r / sumAdj;
            const blueRatio = b / sumAdj;

            if (greenRatio <= redRatio * 1.12 || greenRatio <= blueRatio * 1.12) {
                return false;
            }

            const greenIndex = (2 * g - r - b) / sumAdj;
            if (greenIndex <= 0.55) return false;

            const maxRGB = Math.max(r, g, b);
            const minRGB = Math.min(r, g, b);
            if ((maxRGB - minRGB) < 4) return false;

            if (g <= r * 1.05) return false;

            return true;
        }

        function detectGreen() {
            const video = findCameraVideo();

            if (!video || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                greenStatus.innerHTML = "⏳ Đang chờ camera MindAR...";
                requestAnimationFrame(detectGreen);
                return;
            }

            try {
                ctx.drawImage(video, 0, 0, W, H);
            } catch (error) {
                requestAnimationFrame(detectGreen);
                return;
            }

            let imageData;
            try {
                imageData = ctx.getImageData(0, 0, W, H);
            } catch (error) {
                requestAnimationFrame(detectGreen);
                return;
            }

            const data = imageData.data;
            let totalX = 0;
            let totalY = 0;
            let count = 0;

            for (let y = 0; y < H; y += 2) {
                const rowOffset = y * W;
                for (let x = 0; x < W; x += 2) {
                    const i = (rowOffset + x) << 2;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    if (isGreen(r, g, b)) {
                        totalX += x;
                        totalY += y;
                        count++;
                    }
                }
            }

            if (count >= MIN_GREEN_PIXELS) {
                const centerX = totalX / count;
                const centerY = totalY / count;

                const screenX = (centerX / W) * window.innerWidth;
                const screenY = (centerY / H) * window.innerHeight;

                redDot.style.display = "block";
                redDot.style.left = screenX + "px";
                redDot.style.top = screenY + "px";

                greenStatus.innerHTML = `🟢 XANH ĐƯỢC PHÁT HIỆN<br>📍 X: ${Math.round(screenX)} | Y: ${Math.round(screenY)}<br>🔴 Chấm đỏ đang ở tâm vùng xanh`;
                greenStatus.style.color = "#00ff66";
                greenStatus.style.borderColor = "#00ff66";
            } else {
                redDot.style.display = "none";
                greenStatus.innerHTML = "🔴 KHÔNG CÓ MÀU XANH";
                greenStatus.style.color = "#ff3366";
                greenStatus.style.borderColor = "#ff3366";
            }

            requestAnimationFrame(detectGreen);
        }

        window.addEventListener("load", function () {
            setTimeout(detectGreen, 500);
        });
    </script>
</body>
</html>
