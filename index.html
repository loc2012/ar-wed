<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR VR Split Screen</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        a-scene { width: 100vw !important; height: 100vh !important; position: absolute !important; top: 0 !important; left: 0 !important; }

        #ui-overlay {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 99999;
            background: rgba(0, 0, 0, 0.7); padding: 10px; border-radius: 20px; border: 1px solid #00ffcc;
            text-align: center; font-family: sans-serif;
        }
        .btn { background: #00ffcc; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 Chọn Phim</button>
        <button class="btn" id="play-btn">▶️ Phát</button>
        <input type="file" id="file-input" accept="video/*" style="display:none;">
    </div>

    <a-assets>
        <video id="ar-video" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <!-- ĐÃ SỬA: Bỏ physicallyCorrectLights (nguyên nhân gây đen màn), dùng precision: low để máy cũ chạy mượt -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="precision: low; antialias: false;" 
        vr-mode-ui="enabled: true" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <a-sphere color="red" radius="0.1" position="0 0 0.05"></a-sphere>
            <a-box position="0 0 0.25" material="color: #4CC3D9; wireframe: true" scale="0.25 0.25 0.25"
                   animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
            </a-box>
            <!-- Video dán lên -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const fileInput = document.getElementById('file-input');
        const playBtn = document.getElementById('play-btn');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.load();
            }
        });

        playBtn.addEventListener('click', () => {
            video.muted = false;
            video.play();
            playBtn.innerText = "🔊 Đang Phát";
        });
    </script>
</body>
</html>
