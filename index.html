<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video Full Fix</title>
    
    <!-- Nạp thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        #status-bar { 
            position: fixed; top: 10px; left: 10px; z-index: 9999; 
            background: rgba(0, 0, 0, 0.8); color: #00ffcc; padding: 10px 15px; 
            border-radius: 10px; font-weight: bold; border: 1px solid #00ffcc; 
            font-family: sans-serif; font-size: 13px;
        }

        #ui-controls { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 9999; display: flex; gap: 10px; 
        }

        button { 
            background: #00ffcc; color: #000; border: none; padding: 12px 20px; 
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; 
        }
    </style>
</head>
<body>

    <div id="status-bar">🚀 Đang nạp AR... Hãy đợi chút!</div>
    
    <div id="ui-controls">
        <button onclick="document.getElementById('v-input').click()">📂 Chọn Video</button>
        <button id="p-btn">▶️ Mở Tiếng</button>
        <input type="file" id="v-input" accept="video/*" style="display:none">
    </div>

    <!-- Video ẩn dùng để render 3D -->
    <video id="ar-video" loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display:none;"></video>

    <!-- Khung cảnh AR MindAR -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: false; antialias: false;">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Nhóm chứa đối tượng AR -->
        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <!-- Màn hình phát video -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
            <!-- Khung viền 3D màu xanh nổi lên để báo hiệu AR đã bắt dính -->
            <a-ring radius-inner="0.55" radius-outer="0.6" color="#00ffcc" material="side: double" rotation="0 0 0" position="0 0 0.02"></a-ring>
        </a-entity>

    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const input = document.getElementById('v-input');
        const pBtn = document.getElementById('p-btn');
        const status = document.getElementById('status-bar');
        const target = document.getElementById('target');
        const scene = document.querySelector('#ar-scene');

        // Báo trạng thái sẵn sàng
        scene.addEventListener('loaded', () => {
            status.innerText = "✅ AR Sẵn Sàng! Hãy Bấm '📂 Chọn Video'.";
        });

        // Xử lý nạp File Video
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.load();
                video.muted = true; // Ép muted để Chrome không chặn
                
                video.play().then(() => {
                    status.innerText = "✅ Video nạp thành công! Rọi camera vào hình vẽ đi.";
                }).catch(err => {
                    status.innerText = "❌ File video bị lỗi hoặc không hỗ trợ!";
                });
            }
        };

        // Bật tiếng
        pBtn.onclick = () => {
            if (video.src) {
                video.muted = false;
                video.play();
                status.innerText = "🔊 Đã Bật Tiếng Video!";
            } else {
                alert("Bạn chưa chọn file video!");
            }
        };

        // Bắt sự kiện rọi camera trúng hình ảnh
        target.addEventListener("targetFound", () => { 
            if (video.src) {
                video.play();
                status.innerText = "🎯 BẮT TRÚNG HÌNH! Đang phát Video AR...";
            } else {
                status.innerText = "🎯 Bắt trúng hình! Nhưng bạn chưa chọn Video.";
            }
        });
        
        target.addEventListener("targetLost", () => { 
            if (video.src) video.pause();
            status.innerText = "⚠️ Mất dấu hình vẽ - Hãy rọi lại camera vào ảnh!";
        });
    </script>
</body>
</html>
