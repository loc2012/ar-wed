<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>AR Video - MindAR</title>

    <!-- GIỮ NGUYÊN PHIÊN BẢN -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #instruction {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 99999;

            background: rgba(0, 0, 0, 0.75);
            color: #00ffcc;

            padding: 10px 18px;

            border: 1px solid #00ffcc;
            border-radius: 25px;

            font-size: 14px;
            text-align: center;

            white-space: nowrap;

            box-shadow: 0 0 12px rgba(0, 255, 204, 0.35);
        }

        #controls {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 20px;

            z-index: 100000;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            pointer-events: none;
        }

        #controls button {
            pointer-events: auto;

            border: 1px solid #00ffcc;
            border-radius: 30px;

            background: rgba(0, 0, 0, 0.82);
            color: #00ffcc;

            padding: 13px 18px;

            font-size: 14px;
            font-weight: bold;

            box-shadow: 0 0 10px rgba(0, 255, 204, 0.25);

            -webkit-tap-highlight-color: transparent;
        }

        #controls button:active {
            transform: scale(0.94);
        }

        #video-file {
            display: none;
        }

        /* Ẩn video gốc, video thật sẽ được A-Frame hiển thị */
        #ar-video {
            display: none;
        }
    </style>
</head>

<body>

    <!-- THÔNG BÁO -->
    <div id="instruction">
        📸 Rọi camera vào hình nhận dạng...
    </div>


    <!-- BỘ ĐIỀU KHIỂN -->
    <div id="controls">

        <input
            id="video-file"
            type="file"
            accept="video/mp4,video/*">

        <button id="choose-video">
            📂 Chọn Video
        </button>

        <button id="sound-button">
            🔊 Bật Tiếng
        </button>

    </div>


    <!-- VIDEO NGUỒN -->
    <video
        id="ar-video"
        loop
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        muted
        preload="auto"
        style="display:none;">
    </video>


    <!-- ===================================================== -->
    <!--                  MINDAR / A-FRAME                     -->
    <!-- ===================================================== -->

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">


        <!-- CAMERA AR -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- ================================================= -->
        <!--             ẢNH NHẬN DẠNG TARGET 0               -->
        <!-- ================================================= -->

        <a-entity
            id="image-target"
            mindar-image-target="targetIndex: 0">


            <!-- ============================================= -->
            <!--              MÀN HÌNH VIDEO                   -->
            <!-- ============================================= -->

            <a-video
                id="ar-video-plane"
                src="#ar-video"

                width="1"
                height="0.5625"

                position="0 0 0.015"

                material="
                    shader: flat;
                    side: double;
                    transparent: false;
                    opacity: 1;
                ">
            </a-video>


            <!-- ============================================= -->
            <!--          VIỀN 3D QUANH VIDEO                 -->
            <!-- ============================================= -->

            <a-ring
                id="ring-1"

                color="#00ffcc"

                radius-inner="0.55"
                radius-outer="0.57"

                position="0 0 0.025"

                material="
                    shader: flat;
                    transparent: true;
                    opacity: 0.9;
                "

                animation="
                    property: rotation;
                    to: 0 0 360;
                    loop: true;
                    dur: 4000;
                    easing: linear;
                ">
            </a-ring>


            <!-- VÒNG NGOÀI -->
            <a-ring
                id="ring-2"

                color="#00ffcc"

                radius-inner="0.63"
                radius-outer="0.65"

                position="0 0 0.025"

                material="
                    shader: flat;
                    transparent: true;
                    opacity: 0.45;
                "

                animation="
                    property: scale;
                    from: 0.85 0.85 0.85;
                    to: 1.15 1.15 1.15;
                    dir: alternate;
                    loop: true;
                    dur: 1200;
                    easing: easeInOutSine;
                ">
            </a-ring>


            <!-- CÁC ĐIỂM TRANG TRÍ 3D -->
            <a-sphere
                radius="0.025"
                color="#00ffcc"
                position="-0.57 0 0.04"

                animation="
                    property: rotation;
                    to: 0 0 -360;
                    loop: true;
                    dur: 3000;
                    easing: linear;
                ">
            </a-sphere>


            <a-sphere
                radius="0.025"
                color="#00ffcc"
                position="0.57 0 0.04"

                animation="
                    property: rotation;
                    to: 0 0 -360;
                    loop: true;
                    dur: 3000;
                    easing: linear;
                ">
            </a-sphere>


        </a-entity>

    </a-scene>


    <!-- ===================================================== -->
    <!--                    JAVASCRIPT                        -->
    <!-- ===================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const video =
                document.getElementById("ar-video");

            const target =
                document.getElementById("image-target");

            const instruction =
                document.getElementById("instruction");

            const chooseVideo =
                document.getElementById("choose-video");

            const videoFile =
                document.getElementById("video-file");

            const soundButton =
                document.getElementById("sound-button");


            let selectedVideoURL = null;

            let targetDetected = false;


            /* =================================================
               CHỌN VIDEO
            ================================================= */

            chooseVideo.addEventListener("click", function () {

                videoFile.click();

            });


            videoFile.addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (!file) {
                    return;
                }


                /*
                 * Xóa Blob URL cũ
                 */

                if (selectedVideoURL) {

                    URL.revokeObjectURL(selectedVideoURL);

                }


                /*
                 * Tạo Blob URL mới
                 */

                selectedVideoURL =
                    URL.createObjectURL(file);


                /*
                 * Cấu hình video
                 */

                video.pause();

                video.src = selectedVideoURL;

                video.muted = true;

                video.loop = true;

                video.playsInline = true;


                /*
                 * Nạp video
                 */

                video.load();


                /*
                 * Reset nút âm thanh
                 */

                soundButton.textContent =
                    "🔊 Bật Tiếng";


                /*
                 * Nếu hình đang được nhận diện
                 * thì phát video ngay
                 */

                if (targetDetected) {

                    video.play().catch(function () {

                        console.log(
                            "Video cần thao tác người dùng."
                        );

                    });

                }


                instruction.textContent =
                    "🎬 Đã chọn video - Rọi vào hình!";

            });


            /* =================================================
               BẬT / TẮT ÂM THANH
            ================================================= */

            soundButton.addEventListener("click", function () {

                if (!video.src) {

                    instruction.textContent =
                        "📂 Hãy chọn video trước!";

                    return;
                }


                if (video.muted) {

                    video.muted = false;

                    soundButton.textContent =
                        "🔇 Tắt Tiếng";


                    video.play().catch(function () {

                        /*
                         * Nếu trình duyệt chặn âm thanh,
                         * quay lại trạng thái muted.
                         */

                        video.muted = true;

                        soundButton.textContent =
                            "🔊 Bật Tiếng";

                    });

                } else {

                    video.muted = true;

                    soundButton.textContent =
                        "🔊 Bật Tiếng";

                }

            });


            /* =================================================
               NHẬN DIỆN ĐƯỢC ẢNH
            ================================================= */

            target.addEventListener(
                "targetFound",
                function () {

                    targetDetected = true;


                    instruction.textContent =
                        "🎯 Đã bắt được hình!";


                    /*
                     * Có video thì phát
                     */

                    if (video.src) {

                        video.play().catch(function () {

                            console.log(
                                "Không thể tự động phát video."
                            );

                        });

                    }

                }
            );


            /* =================================================
               MẤT ẢNH
            ================================================= */

            target.addEventListener(
                "targetLost",
                function () {

                    targetDetected = false;


                    /*
                     * Dừng video khi mất target
                     */

                    video.pause();


                    instruction.textContent =
                        "⚠️ Mất dấu - Rọi lại vào hình!";

                }
            );


            /* =================================================
               VIDEO ĐÃ SẴN SÀNG
            ================================================= */

            video.addEventListener(
                "loadeddata",
                function () {

                    if (targetDetected) {

                        video.play().catch(function () {

                            console.log(
                                "Chờ thao tác người dùng."
                            );

                        });

                    }

                }
            );


            /* =================================================
               XỬ LÝ LỖI VIDEO
            ================================================= */

            video.addEventListener(
                "error",
                function () {

                    instruction.textContent =
                        "❌ Không đọc được video!";

                }
            );

        });

    </script>

</body>
                </html>
