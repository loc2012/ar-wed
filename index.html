<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Split Screen</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        /* Tự chia đôi màn hình thủ công */
        .split {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        .view {
            width: 50%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="split">
        <div class="view">
            <a-scene embedded mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;">
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                <a-entity mindar-image-target="targetIndex: 0">
                    <a-box color="red" scale="0.2 0.2 0.2" position="0 0 0"></a-box>
                </a-entity>
            </a-scene>
        </div>
        <div class="view">
            <a-scene embedded mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;">
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                <a-entity mindar-image-target="targetIndex: 0">
                    <a-box color="red" scale="0.2 0.2 0.2" position="0 0 0"></a-box>
                </a-entity>
            </a-scene>
        </div>
    </div>
</body>
</html>
