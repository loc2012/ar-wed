<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>

















<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Camera + Nhận diện màu xanh</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* CAMERA / AR */
        #vr-wrapper {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* THÔNG BÁO KHỐI 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;

            background: rgba(0,0,0,.85);
            color: #00ffcc;

            padding: 10px 18px;
            border-radius: 20px;

            border: 1px solid #00ffcc;

            font-size: 13px;
            font-weight: bold;

            text-align: center;

            box-shadow: 0 0 10px rgba(0,255,204,.4);

            white-space: nowrap;
        }

        /* LỚP CANVAS NHẬN DIỆN */
        #green-detection-canvas {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 99990;

            pointer-events: none;
        }

        /* DẤU CHẤM ĐỎ */
        #red-dot {
            position: fixed;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: red;

            border: 4px solid white;

            box-shadow:
                0 0 15px red,
                0 0 30px red;

            transform: translate(-50%, -50%);

            z-index: 999999;

            display: none;

            pointer-events: none;
        }

        /* THÔNG TIN XANH */
        #green-status {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            z-index: 999999;

            min-width: 260px;

            padding: 12px 18px;

            border-radius: 15px;

            background: rgba(0,0,0,.85);

            color: white;

            text-align: center;

            font-size: 14px;
            font-weight: bold;

            border: 2px solid #555;

            box-shadow: 0 0 15px rgba(0,0,0,.5);
        }

        /* NÚT VR */
        #btn-vr {
            position: fixed;

            right: 15px;
            bottom: 25px;

            z-index: 1000000;

            background: #00ffcc;

            color: #000;

            border: 2px solid #00ffcc;

            padding: 12px 20px;

            border-radius: 30px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        /* Chế độ chia đôi */
        body.mode-vr-split #vr-wrapper {
            width: 50vw;
        }

        body.mode-vr-split #green-detection-canvas {
            width: 50vw;
        }

        body.mode-vr-split #block1-status {
            left: 25%;
        }

        body.mode-vr-split #green-status {
            left: 25%;
        }
    </style>
</head>

<body>

    <!-- TRẠNG THÁI CAMERA -->
    <div id="block1-status">
        📌 [KHỐI 1] Đang khởi động Camera Sau...
    </div>

    <!-- KHUNG AR -->
    <div id="vr-wrapper">

        <a-scene
            id="ar-scene"

            mindar-image="
                imageTargetSrc: ./targets.mind;
                autoStart: true;
                uiLoading: no;
                uiScanning: no;
            "

            embedded

            color-space="sRGB"

            renderer="
                colorManagement: true;
                physicallyCorrectLights
            "

            vr-mode-ui="enabled: false"

            device-orientation-permission-ui="enabled: false"
        >

            <a-camera
                position="0 0 0"
                look-controls="enabled: false">
            </a-camera>

            <!-- TARGET MINDAR -->
            <a-entity mindar-image-target="targetIndex: 0">

                <a-box
                    position="0 0 0.25"

                    material="
                        color: #00ffcc;
                        wireframe: true
                    "

                    scale="0.3 0.3 0.3"

                    animation="
                        property: rotation;
                        to: 0 360 360;
                        loop: true;
                        dur: 4000;
                        easing: linear
                    ">
                </a-box>

            </a-entity>

        </a-scene>
    </div>

    <!-- CANVAS XỬ LÝ MÀU -->
    <canvas id="green-detection-canvas"></canvas>

    <!-- CHẤM ĐỎ -->
    <div id="red-dot"></div>

    <!-- TRẠNG THÁI NHẬN DIỆN -->
    <div id="green-status">
        🔍 Đang tìm màu xanh lá...
    </div>

    <!-- NÚT VR -->
    <button id="btn-vr">
        🥽 Bật Chia Đôi VR
    </button>


<script>

    /* =====================================================
       KHỐI 1
       CAMERA SAU
    ===================================================== */

    const videoEl = document.createElement("video");

    videoEl.autoplay = true;
    videoEl.playsInline = true;
    videoEl.muted = true;

    videoEl.style.display = "none";

    document.body.appendChild(videoEl);


    const statusEl =
        document.getElementById("block1-status");


    const constraints = {

        video: {

            facingMode: {
                ideal: "environment"
            },

            width: {
                ideal: 1280
            },

            height: {
                ideal: 720
            }

        },

        audio: false

    };


    navigator.mediaDevices
        .getUserMedia(constraints)

        .then(function(stream) {

            videoEl.srcObject = stream;

            statusEl.innerText =
                "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";

            statusEl.style.color = "#00ffcc";
            statusEl.style.borderColor = "#00ffcc";

        })

        .catch(function(err) {

            console.error(err);

            statusEl.innerText =
                "🔴 [KHỐI 1] LỖI CAMERA: " +
                err.message;

            statusEl.style.color = "#ff3366";
            statusEl.style.borderColor = "#ff3366";

        });


    /* =====================================================
       KHỐI NHẬN DIỆN MÀU XANH
    ===================================================== */

    const canvas =
        document.getElementById(
            "green-detection-canvas"
        );

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });


    const redDot =
        document.getElementById("red-dot");


    const greenStatus =
        document.getElementById("green-status");


    /*
       Chuyển RGB -> HSV

       HSV giúp nhận diện xanh lá tốt hơn
       khi độ sáng thay đổi.
    */

    function rgbToHsv(r, g, b) {

        r /= 255;
        g /= 255;
        b /= 255;

        const max =
            Math.max(r, g, b);

        const min =
            Math.min(r, g, b);

        const d = max - min;

        let h = 0;

        if (d !== 0) {

            if (max === r) {

                h =
                    ((g - b) / d) % 6;

            } else if (max === g) {

                h =
                    (b - r) / d + 2;

            } else {

                h =
                    (r - g) / d + 4;

            }

            h *= 60;

            if (h < 0)
                h += 360;
        }

        const s =
            max === 0
                ? 0
                : d / max;

        const v = max;

        return {
            h: h,
            s: s,
            v: v
        };
    }


    /*
       KIỂM TRA CÓ PHẢI XANH LÁ KHÔNG

       Hue xanh lá:
       khoảng 35 -> 150 độ

       Saturation thấp vẫn cho phép
       để bắt xanh hơi tối / hơi nhạt.

       Đồng thời dùng tỷ lệ RGB:
       G phải nổi bật hơn R và B.
    */

    function isGreen(r, g, b) {

        const hsv =
            rgbToHsv(r, g, b);


        /*
           Điều kiện 1:
           Hue thuộc vùng xanh.
        */

        const hueGreen =
            hsv.h >= 35 &&
            hsv.h <= 150;


        /*
           Điều kiện 2:
           G phải lớn hơn R/B.

           Điều này giúp giảm nhận nhầm
           màu xám hoặc màu trắng.
        */

        const greenDominant =
            g > r * 1.08 &&
            g > b * 1.08;


        /*
           Điều kiện 3:
           Không loại bỏ xanh tối quá mạnh.

           0.06 = khoảng 6% độ sáng.
        */

        const brightnessOK =
            hsv.v > 0.06;


        /*
           Saturation.
           Với xanh rất tối, saturation có thể
           không ổn định nên dùng điều kiện
           RGB phía trên hỗ trợ.
        */

        const saturationOK =
            hsv.s > 0.18;


        return (
            hueGreen &&
            greenDominant &&
            brightnessOK &&
            saturationOK
        );
    }


    /* =====================================================
       NHẬN DIỆN
    ===================================================== */

    function detectGreen() {

        if (
            videoEl.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
        ) {

            requestAnimationFrame(detectGreen);

            return;
        }


        /*
           Giảm kích thước ảnh để xử lý nhanh hơn.
        */

        const w = 320;
        const h = 240;


        /*
           Canvas thực tế dùng kích thước nhỏ
           nhưng CSS phóng toàn màn hình.
        */

        canvas.width = w;
        canvas.height = h;


        ctx.drawImage(
            videoEl,
            0,
            0,
            w,
            h
        );


        const imageData =
            ctx.getImageData(
                0,
                0,
                w,
                h
            );


        const data =
            imageData.data;


        let totalX = 0;
        let totalY = 0;

        let count = 0;


        /*
           Bỏ qua pixel.

           3 pixel lấy 1 lần giúp
           giảm tải CPU điện thoại.
        */

        for (
            let y = 0;
            y < h;
            y += 3
        ) {

            for (
                let x = 0;
                x < w;
                x += 3
            ) {

                const i =
                    (y * w + x) * 4;


                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];


                if (
                    isGreen(r, g, b)
                ) {

                    totalX += x;
                    totalY += y;

                    count++;

                }
            }
        }


        /*
           Cần đủ số pixel xanh
           mới xác nhận.

           Điều này tránh một vài pixel
           nhiễu tạo ra chấm đỏ.
        */

        const MIN_GREEN_PIXELS = 100;


        if (
            count >= MIN_GREEN_PIXELS
        ) {

            const centerX =
                totalX / count;

            const centerY =
                totalY / count;


            /*
               Chuyển tọa độ canvas
               sang tọa độ màn hình.
            */

            const screenX =
                centerX / w *
                window.innerWidth;


            const screenY =
                centerY / h *
                window.innerHeight;


            /*
               Đặt chấm đỏ.
            */

            redDot.style.display =
                "block";

            redDot.style.left =
                screenX + "px";

            redDot.style.top =
                screenY + "px";


            /*
               Báo trạng thái.
            */

            greenStatus.innerHTML =
                "🟢 XANH LÁ ĐƯỢC PHÁT HIỆN" +
                "<br>" +
                "📍 X: " +
                Math.round(screenX) +
                " | Y: " +
                Math.round(screenY) +
                "<br>" +
                "🔴 Dấu chấm đang ở trên màn hình";


            greenStatus.style.color =
                "#00ff66";

            greenStatus.style.borderColor =
                "#00ff66";


        } else {

            /*
               Không tìm thấy xanh.
            */

            redDot.style.display =
                "none";


            greenStatus.innerHTML =
                "🔴 KHÔNG CÓ MÀU XANH LÁ" +
                "<br>" +
                "Dấu chấm không xuất hiện trên màn hình";


            greenStatus.style.color =
                "#ff3366";

            greenStatus.style.borderColor =
                "#ff3366";
        }


        requestAnimationFrame(
            detectGreen
        );
    }


    /*
       Bắt đầu nhận diện.
    */

    videoEl.addEventListener(
        "loadeddata",
        function() {

            detectGreen();

        }
    );


    /* =====================================================
       VR SPLIT
    ===================================================== */

    const btnVR =
        document.getElementById(
            "btn-vr"
        );


    let isVR = false;


    btnVR.addEventListener(
        "click",
        function() {

            isVR = !isVR;


            if (isVR) {

                document.body.classList.add(
                    "mode-vr-split"
                );


                btnVR.innerText =
                    "📱 Màn Hình Đơn";


                btnVR.style.background =
                    "#ff3366";


                btnVR.style.borderColor =
                    "#ff3366";


                btnVR.style.color =
                    "#fff";


            } else {

                document.body.classList.remove(
                    "mode-vr-split"
                );


                btnVR.innerText =
                    "🥽 Bật Chia Đôi VR";


                btnVR.style.background =
                    "#00ffcc";


                btnVR.style.borderColor =
                    "#00ffcc";


                btnVR.style.color =
                    "#000";

            }


            window.dispatchEvent(
                new Event("resize")
            );

        }
    );

</script>

</body>
</html>
