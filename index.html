<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video VR Box</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* Khung chọn file gọn gàng góc trên */
        #upload-box {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0,0,0,0.8);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
        }
        #upload-box input {
            color: #fff;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Ô TẢI VIDEO TRỰC TIẾP TỪ ĐIỆN THOẠI -->
    <div id="upload-box">
        <input type="file" id="video-file" accept="video/*">
    </div>

    <!-- VIDEO BỘ NHỚ -->
    <video id="ar-video" loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display:none;"></video>

    <!-- BẢN CODE AR CHUẨN CỦA BẠN (TẮT VR UI ĐỂ KHÔNG ĐEN MÀN HÌNH) -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="precision: low; antialias: false;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <!-- Tấm nền video 3D 16:9 dán lên hình carton -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
        </a-entity>

    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const fileInput = document.getElementById('video-file');
        const target = document.getElementById('target-entity');

        // Chọn file video từ điện thoại là gán thẳng vào AR
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.muted = false; // Bật tiếng
                video.play();
            }
        });

        // Soi trúng hình carton thì phát, mất hình thì dừng
        target.addEventListener("targetFound", () => { if(video.src) video.play(); });
        target.addEventListener("targetLost", () => { if(video.src) video.pause(); });
    </script>
</body>
</html>
