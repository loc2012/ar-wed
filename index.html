9p(<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>











<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 2: Nhận Diện Hình Ảnh Nhạy Cao</title>
    
    <!-- Nạp thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Thanh hiển thị trạng thái Khối 2 */
        #block2-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #ffcc00;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            pointer-events: none;
            width: 85%;
            max-width: 350px;
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <!-- TRẠNG THÁI HIỂN THỊ KHỐI 2 -->
    <div id="block2-status">⏳ [KHỐI 2] Đang nạp dữ liệu nhận diện...</div>

    <!-- KHUNG CẢNH AR (TỐI ƯU ĐỘ NHẠY TỐI ĐA) -->
    <!-- Mẹo tăng độ nhạy: filterMinCF: 0.0001, filterBeta: 0.001, missTolerance: 5 -->
    <a-scene 
            <!-- KHUNG CẢNH AR (TỐI ƯU ĐỘ NHẠY VÀ THỜI GIAN CHỜ) -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; warmupTolerance: 10; missTolerance: 10;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- VÙNG NHẬN DIỆN MẪU (Target Index: 0) -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-0">
            
            <!-- Khung viền Neon màu đỏ xuất hiện khi bắt trúng hình -->
            <a-ring 
                radius-inner="0.45" 
                radius-outer="0.5" 
                color="#00ffcc" 
                material="side: double" 
                position="0 0 0.01"
                animation="property: rotation; to: 0 0 360; loop: true; dur: 2000; easing: linear">
            </a-ring>

            <a-circle color="#00ffcc" radius="0.08" position="0 0 0.01"></a-circle>

        </a-entity>
    </a-scene>

    <!-- LOGIC NHẬN DIỆN KHỐI 2 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const statusEl = document.getElementById("block2-status");
            const sceneEl = document.querySelector("#ar-scene");
            const targetEl = document.getElementById("target-0");

            // 1. Khi dữ liệu AR nạp xong
            sceneEl.addEventListener("loaded", function () {
                statusEl.innerText = "❌ KHÔNG THẤY (Đang quét...)";
                statusEl.style.borderColor = "#ff3366";
                statusEl.style.color = "#ff3366";
                statusEl.style.boxShadow = "0 0 15px rgba(255, 51, 102, 0.4)";
            });

            // 2. KHI TÌM THẤY HÌNH (SO SÁNH KHỚP VỚI TARGETS.MIND)
            targetEl.addEventListener("targetFound", function () {
                statusEl.innerText = "🟢 OK! ĐÃ THẤY HÌNH MẪU";
                statusEl.style.borderColor = "#00ffcc";
                statusEl.style.color = "#00ffcc";
                statusEl.style.boxShadow = "0 0 20px rgba(0, 255, 204, 0.8)";
            });

            // 3. KHI MẤT DẤU HÌNH
            targetEl.addEventListener("targetLost", function () {
                statusEl.innerText = "❌ KHÔNG THẤY";
                statusEl.style.borderColor = "#ff3366";
                statusEl.style.color = "#ff3366";
                statusEl.style.boxShadow = "0 0 15px rgba(255, 51, 102, 0.4)";
            });
        });
    </script>

</body>
</html>



























<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>


















<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 4: Preview Video & Hiển Thị 3D</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* KHUNG PREVIEW VIDEO (GÓC TRÊN BÊN TRÁI) */
        #video-preview-box {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 120px;
            height: 70px;
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            z-index: 999999;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #preview-status {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: #00ffcc;
            font-size: 9px;
            text-align: center;
            padding: 2px 0;
        }

        /* NÚT TẢI VIDEO */
        #block4-ui {
            position: fixed;
            top: 20px;
            right: 15px;
            z-index: 999999;
        }

        .ui-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- 1. KHUNG PREVIEW ĐỂ KIỂM TRA VIDEO NỀN -->
    <div id="video-preview-box">
        <video id="preview-video" loop playsinline webkit-playsinline muted></video>
        <div id="preview-status">Chưa chọn video</div>
    </div>

    <!-- 2. NÚT CHỌN FILE -->
    <div id="block4-ui">
        <button class="ui-btn" id="btn-upload">📂 Tải Video Vô</button>
        <input type="file" id="file-input" accept="video/*">
    </div>

    <!-- 3. SCENE 3D DISPLAY -->
    <a-scene embedded color-space="sRGB" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- KHỐI 3D NẰM THẲNG TRƯỚC MẮT (Xoay 360 liên tục) -->
        <a-entity id="video-3d-group" position="0 0 -2" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            
            <!-- Màn hình chiếu Video 3D dạng tấm bảng phẳng -->
            <a-plane 
                id="video-plane"
                width="1.8" 
                height="1.0" 
                position="0 0 0"
                material="shader: flat; side: double; color: #333333">
            </a-plane>

            <!-- Viền Neon Xanh quanh video để nhận biết vị trí -->
            <a-ring radius-inner="0.9" radius-outer="0.95" color="#00ffcc" position="0 0 -0.01"></a-ring>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnUpload = document.getElementById("btn-upload");
            const fileInput = document.getElementById("file-input");
            const video = document.getElementById("preview-video");
            const statusText = document.getElementById("preview-status");
            const videoPlane = document.getElementById("video-plane");

            btnUpload.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (file) {
                    const videoURL = URL.createObjectURL(file);
                    
                    video.src = videoURL;
                    video.muted = true;

                    video.play().then(() => {
                        statusText.innerText = "▶️ Đang chạy...";
                        statusText.style.color = "#00ffcc";

                        // Cập nhật chất liệu Texture trực tiếp cho màn hình 3D trong A-Frame
                        const THREE = window.THREE;
                        const texture = new THREE.VideoTexture(video);
                        texture.minFilter = THREE.LinearFilter;
                        texture.magFilter = THREE.LinearFilter;

                        const material = new THREE.MeshBasicMaterial({
                            map: texture,
                            side: THREE.DoubleSide
                        });

                        const mesh = videoPlane.getObject3D('mesh');
                        if (mesh) {
                            mesh.material = material;
                        }

                        btnUpload.innerText = "🔊 Mở Tiếng";
                        btnUpload.style.background = "#ff007f";
                        btnUpload.style.color = "#fff";
                    }).catch(err => {
                        statusText.innerText = "❌ Lỗi Video";
                        statusText.style.color = "#ff3366";
                    });
                }
            });

            // Bấm nút Mở tiếng
            btnUpload.addEventListener("click", function() {
                if(video.src && video.muted) {
                    video.muted = false;
                    btnUpload.innerText = "🎬 Video Đang Chạy";
                }
            });
        });
    </script>

</body>
</html>
