<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - Chia Đôi Màn Hình</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #instruction {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            border: 1px solid #00ffcc;
            text-align: center;
            font-size: 13px;
            pointer-events: none;
        }

        /* Vùng chứa 2 màn hình chia đôi */
        .split-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Mỗi nửa màn hình chiếm 50% */
        .view-left, .view-right {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(0, 255, 204, 0.3);
        }

        /* Ép khung canvas của A-Frame phủ đều */
        a-scene {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="instruction">📸 Rọi camera vào hình vẽ...</div>

    <!-- Khung chia đôi màn hình -->
    <div class="split-container">
        
        <!-- MÀN HÌNH BÊN TRÁI -->
        <div class="view-left">
            <a-scene 
                mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
                color-space="sRGB" 
                renderer="colorManagement: true, physicallyCorrectLights" 
                vr-mode-ui="enabled: false" 
                device-orientation-permission-ui="enabled: false"
                embedded>
                
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                <a-entity mindar-image-target="targetIndex: 0" id="target-left">
                    <!-- Hiệu ứng khối lập phương 3D xoay tại tâm -->
                    <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.4 0.4 0.4"
                           animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                    </a-box>
                    <a-circle color="red" radius="0.08" position="0 0 0.01"></a-circle>
                </a-entity>

            </a-scene>
        </div>

        <!-- MÀN HÌNH BÊN PHẢI -->
        <div class="view-right">
            <a-scene 
                mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
                color-space="sRGB" 
                renderer="colorManagement: true, physicallyCorrectLights" 
                vr-mode-ui="enabled: false" 
                device-orientation-permission-ui="enabled: false"
                embedded>
                
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                <a-entity mindar-image-target="targetIndex: 0" id="target-right">
                    <!-- Hiệu ứng khối lập phương 3D xoay song song -->
                    <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.4 0.4 0.4"
                           animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                    </a-box>
                    <a-circle color="red" radius="0.08" position="0 0 0.01"></a-circle>
                </a-entity>

            </a-scene>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const instruction = document.getElementById("instruction");
            const targetLeft = document.getElementById("target-left");

            if (targetLeft) {
                targetLeft.addEventListener("targetFound", function () {
                    instruction.textContent = "🎯 Đã bắt được hình!";
                });

                targetLeft.addEventListener("targetLost", function () {
                    instruction.textContent = "⚠️ Mất dấu - Rọi lại vào hình!";
                });
            }
        });
    </script>

</body>
</html>
