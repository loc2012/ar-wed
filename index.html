<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AR Theo Đốc Hình Vẽ Mẫu</title>
    
    <!-- Thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #instruction {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: sans-serif;
            border: 1px solid #00ffcc;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="instruction">📸 Rọi camera vào hình vẽ trong tập...</div>

    <!-- Đã bỏ ép buộc facingMode để camera tự mở linh hoạt trên mọi máy -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Vòng tròn đỏ ở giữa -->
            <a-circle color="red" radius="0.15" position="0 0 0.05"></a-circle>
            
            <!-- 4 khối cầu màu ở 4 góc -->
            <a-sphere color="yellow" radius="0.08" position="-0.3 0.3 0.1"></a-sphere>
            <a-sphere color="cyan" radius="0.08" position="0.3 0.3 0.1"></a-sphere>
            <a-sphere color="magenta" radius="0.08" position="-0.3 -0.3 0.1"></a-sphere>
            <a-sphere color="green" radius="0.08" position="0.3 -0.3 0.1"></a-sphere>
            
            <!-- Hình lập phương quay ở tâm -->
            <a-box position="0 0 0.25" material="color: #4CC3D9; wireframe: true" scale="0.3 0.3 0.3"
                   animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
            </a-box>
        </a-entity>

    </a-scene>

</body>
</html>
