    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1: Bật Camera Chuẩn</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Đèn báo trạng thái Khối 1 */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* Thẻ hiển thị hình ảnh Camera toàn màn hình */
        #camera-feed {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <!-- THÔNG BÁO TÊN KHỐI & TRẠNG THÁI -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>

    <!-- KHUNG HIỂN THỊ CAMERA -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- LOGIC BẬT CAMERA SAU (FACINGMODE: ENVIRONMENT) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            // Cấu hình ưu tiên lấy Camera Sau của điện thoại
            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            // Kích hoạt luồng Camera
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

</body>
</html>







































<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chia Đôi Màn Hình VR Thật sự</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #block3-ui {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* KHUNG BAO NGOÀI TOÀN BỘ */
        #vr-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* BẬT CHẾ ĐỘ CHIA ĐÔI THẬT SỰ */
        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        /* Mắt trái */
        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 50vw !important;
            height: 100vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        /* Lớp phủ mắt phải dùng CSS Background Reflection */
        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <!-- KHUNG CHỨA SCENE -->
    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <!-- MẮT PHẢI HIỂN THỊ NỬA CÒN LẠI -->
    <div id="right-eye-overlay" id="eye2"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    // Nhúng mirror bằng iframe chính trang này để nhân bản mắt 2 100%
                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

</body>
</html>








<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 3: Chấm Đỏ & Bảng Tọa Độ Realtime</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: monospace, sans-serif;
        }

        /* CANVAS HỢP NHẤT KHỐI 3 (XUẤT CHO KHỐI 2) */
        #khoi3-output-canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* BẢNG BÁO THÔNG SỐ TỌA ĐỘ (HUD) */
        #hud-panel {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff0055;
            padding: 10px 20px;
            border-radius: 15px;
            color: #00ffcc;
            font-size: 13px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            text-align: center;
            line-height: 1.6;
            white-space: nowrap;
        }

        /* THANH CHỈNH KÍCH CỠ CHẤM ĐỎ */
        #control-panel {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ffcc;
            font-size: 12px;
            font-weight: bold;
        }

        #size-slider {
            width: 100px;
            accent-color: #ff0055;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- BẢNG THÔNG SỐ TỌA ĐỘ THỜI GIAN THỰC -->
    <div id="hud-panel">
        <div id="status-text" style="color: #ff0055; font-weight: bold;">🔍 ĐANG TÌM ĐÈN...</div>
        <div id="coords-text">Tọa độ: X = -- | Y = --</div>
        <div id="stats-text">Điểm sáng: 0 px | Bán kính: 0 px</div>
    </div>

    <!-- THANH TRUỘT CHỈNH KÍCH CỠ CHẤM ĐỎ -->
    <div id="control-panel">
        <span>To/Nhỏ Chấm Đỏ:</span>
        <input type="range" id="size-slider" min="0.5" max="5.0" step="0.1" value="2.0">
    </div>

    <!-- CANVAS ĐẦU RA CỦA KHỐI 3 -->
    <canvas id="khoi3-output-canvas"></canvas>

    <script>
        let webcamElement = null; // Dùng chung Cam với Khối 1
        const canvas = document.getElementById('khoi3-output-canvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('size-slider');

        const statusText = document.getElementById('status-text');
        const coordsText = document.getElementById('coords-text');
        const statsText = document.getElementById('stats-text');

        // TỰ ĐỘNG TÌM VÀ DÙNG CHUNG CAM CỦA KHỐI 1 (TRÁNH LỖI ĐỎ BẬT CAM)
        function findAndShareCamera() {
            const allVideos = document.querySelectorAll('video');
            for (let vid of allVideos) {
                if (vid.srcObject || vid.currentTime > 0) {
                    webcamElement = vid;
                    return true;
                }
            }
            return false;
        }

        // VÒNG LẶP XỬ LÝ CHẤM ĐỎ & TỌA ĐỘ
        function processKhoi3() {
            if (!webcamElement) {
                findAndShareCamera();
            }

            if (webcamElement && webcamElement.readyState >= 2) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // 1. Lấy khung hình Cam Khối 1
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(webcamElement, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();

                // 2. Lọc điểm sáng Xanh
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                let sumX = 0, sumY = 0, count = 0;
                let step = 6; // Bước nhảy lọc pixel siêu nhẹ

                for (let i = 0; i < data.length; i += 4 * step) {
                    let r = data[i], g = data[i+1], b = data[i+2];

                    if (g > 80 && g > r * 1.25 && g > b * 1.1) {
                        let pixelIndex = i / 4;
                        let x = pixelIndex % canvas.width;
                        let y = Math.floor(pixelIndex / canvas.width);
                        sumX += x;
                        sumY += y;
                        count++;
                    }
                }

                // 3. VẼ CHẤM ĐỎ VÀ CẬP NHẬT TỌA ĐỘ
                if (count > 3) {
                    let avgX = Math.round(sumX / count);
                    let avgY = Math.round(sumY / count);

                    // Tính bán kính Chấm Đỏ = (Căn diện tích) x (Slider)
                    let scaleMultiplier = parseFloat(slider.value);
                    let radius = Math.min(Math.max(Math.sqrt(count * step) * 2 * scaleMultiplier, 15), 200);

                    // --- VẼ CHẤM ĐỎ NEON TO ĐÙNG ---
                    ctx.beginPath();
                    ctx.arc(avgX, avgY, radius, 0, 2 * Math.PI, false);
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 25; // Hiệu ứng phát sáng Neon
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    // Chấm trắng tâm điểm chính giữa
                    ctx.beginPath();
                    ctx.arc(avgX, avgY, 5, 0, 2 * Math.PI, false);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    // --- CẬP NHẬT BẢNG THÔNG SỐ REALTIME ---
                    statusText.innerText = "⚡ ĐÃ KHÓA MỤC TIÊU";
                    statusText.style.color = "#00ffcc";
                    coordsText.innerText = `Tọa độ (X, Y): X = ${avgX} px | Y = ${avgY} px`;
                    statsText.innerText = `Diện tích: ${count} px | Bán kính: ${Math.round(radius)} px`;
                } else {
                    // Trạng thái khi không thấy đèn
                    statusText.innerText = "🔍 ĐANG TÌM ĐÈN...";
                    statusText.style.color = "#ff0055";
                    coordsText.innerText = `Tọa độ (X, Y): -- , --`;
                    statsText.innerText = `Diện tích: 0 px | Bán kính: 0 px`;
                }
            }

            requestAnimationFrame(processKhoi3);
        }

        requestAnimationFrame(processKhoi3);
    </script>
</body>
</html>
 
    

















<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 4: Sửa Lỗi Chọn File Video</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: sans-serif;
        }

        #khoi4-video { display: none; }

        #main-canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* BẢNG ĐIỀU KHIỂN ĐẨY LÊN CAO - TRÁNH BỊ CHE */
        #khoi4-control-panel {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999; /* Ưu tiên cao nhất */
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffcc;
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00ffcc;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            white-space: nowrap;
        }

        /* 🚀 NÚT NẠP FILE TRỰC TIẾP DÙNG THẺ LABEL (BẤM LÀ MỞ MÁY NGAY) */
        .btn-file-label {
            background: #00ffcc;
            color: #000;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: inline-block;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-file-label:active {
            transform: scale(0.92);
            background: #ffffff;
        }

        /* Ẩn thẻ input thực sự đi, chỉ dùng Label kích hoạt */
        #khoi4-file-input {
            display: none !important;
        }

        #video-size-slider {
            width: 70px;
            accent-color: #00ffcc;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- BẢNG KHỐI 4 TẢI VIDEO -->
    <div id="khoi4-control-panel">
        <!-- Dùng Thẻ LABEL thay cho BUTTON để vượt rào bảo mật Android/iOS -->
        <label for="khoi4-file-input" class="btn-file-label">🎬 TẢI VIDEO LÊN</label>
        <input type="file" id="khoi4-file-input" accept="video/*">

        <span>Cỡ:</span>
        <input type="range" id="video-size-slider" min="100" max="600" step="10" value="250">
        
        <span id="khoi4-status" style="color: #ff0055;">(Chưa video)</span>
    </div>

    <video id="khoi4-video" loop muted playsinline></video>
    <canvas id="main-canvas"></canvas>

    <script>
        window.khoi3Target = { x: 0, y: 0, detected: false };

        let webcamElement = null;
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        const videoElement = document.getElementById('khoi4-video');
        const fileInput = document.getElementById('khoi4-file-input');
        const sizeSlider = document.getElementById('video-size-slider');
        const statusText = document.getElementById('khoi4-status');

        let isVideoLoaded = false;

        // 🛠️ LẮNG NGHE SỰ KIỆN CHỌN FILE VIDEO (TRỰC TIẾP 100%)
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const videoURL = URL.createObjectURL(file);
                videoElement.src = videoURL;
                videoElement.play();
                isVideoLoaded = true;

                statusText.innerText = "✅ ĐÃ TẢI";
                statusText.style.color = "#00ffcc";
            }
        });

        function findCameraFromKhoi1() {
            const allVideos = document.querySelectorAll('video');
            for (let vid of allVideos) {
                if (vid.id !== 'khoi4-video' && (vid.srcObject || vid.currentTime > 0)) {
                    webcamElement = vid;
                    return true;
                }
            }
            return false;
        }

        function runKhoi3Engine() {
            if (!webcamElement) findCameraFromKhoi1();

            if (webcamElement && webcamElement.readyState >= 2) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(webcamElement, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                let sumX = 0, sumY = 0, count = 0;
                let step = 8;

                for (let i = 0; i < data.length; i += 4 * step) {
                    let r = data[i], g = data[i+1], b = data[i+2];

                    if (g > 80 && g > r * 1.25 && g > b * 1.1) {
                        let pixelIndex = i / 4;
                        let x = pixelIndex % canvas.width;
                        let y = Math.floor(pixelIndex / canvas.width);
                        sumX += x;
                        sumY += y;
                        count++;
                    }
                }

                if (count > 3) {
                    window.khoi3Target.x = Math.round(sumX / count);
                    window.khoi3Target.y = Math.round(sumY / count);
                    window.khoi3Target.detected = true;
                } else {
                    window.khoi3Target.detected = false;
                }
            }
        }

        function runKhoi4Render() {
            if (window.khoi3Target.detected && isVideoLoaded && videoElement.readyState >= 2) {
                let targetX = window.khoi3Target.x;
                let targetY = window.khoi3Target.y;

                let videoW = parseInt(sizeSlider.value);
                let videoH = videoW * (9 / 16);

                let drawX = targetX - (videoW / 2);
                let drawY = targetY - (videoH / 2);

                ctx.drawImage(videoElement, drawX, drawY, videoW, videoH);

                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.strokeRect(drawX, drawY, videoW, videoH);

                ctx.beginPath();
                ctx.arc(targetX, targetY, 4, 0, 2 * Math.PI);
                ctx.fillStyle = "#ff0055";
                ctx.fill();
            }
        }

        function mainLoop() {
            runKhoi3Engine();
            runKhoi4Render();
            requestAnimationFrame(mainLoop);
        }

        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
