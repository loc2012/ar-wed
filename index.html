<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Xem Phim Máy Tính</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #instruction {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            border: 1px solid #00ffcc;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="instruction">📸 Rọi camera vào máy tính carton...</div>

    <!-- Tải trước file video nằm trên GitHub cùng thư mục -->
    <a-assets>
        <video id="ar-video" src="./video.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
    </a-assets>

    <!-- Khung AR chuẩn ban đầu của bạn (chuẩn 100% không lo đen màn) -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <!-- Thay khối vuông bằng tấm nền video tỉ lệ 16:9 gắn vừa khít mặt máy tính -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
        </a-entity>

    </a-scene>

    <script>
        // Tự động phát video khi soi trúng hình máy tính carton
        const video = document.getElementById('ar-video');
        const target = document.getElementById('target-entity');

        target.addEventListener("targetFound", () => {
            video.play();
        });
        target.addEventListener("targetLost", () => {
            video.pause();
        });
    </script>

</body>
</html>
