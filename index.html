<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Video VR Box</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        /* Thanh điều khiển chọn file và phát video */
        #control-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid #00ffcc;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Thanh công cụ nổi phía trên -->
    <div id="control-bar">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 1. Chọn Video</button>
        <button class="btn" id="play-btn">▶️ 2. Phát / Bật Tiếng</button>
        <input type="file" id="file-input" accept="video/*">
    </div>

    <!-- Khai báo thẻ video chuẩn bảo mật -->
    <video id="ar-video" loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display:none;"></video>

    <!-- Khung AR chuẩn không bị lỗi WebXR/VR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="precision: low; antialias: false;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <!-- Tấm nền Video 16:9 dán lên mô hình máy tính carton -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
        </a-entity>

    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const fileInput = document.getElementById('file-input');
        const playBtn = document.getElementById('play-btn');
        const target = document.getElementById('target-entity');

        // 1. Khi chọn file video từ máy
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.load();
                video.play().then(() => {
                    playBtn.innerText = "🔊 Đang Phát (Bấm để bật tiếng)";
                }).catch(err => {
                    console.log("Cần bấm nút phát:", err);
                });
            }
        });

        // 2. Bấm nút để bật âm thanh & cho phép video chạy
        playBtn.addEventListener('click', () => {
            if (video.src) {
                video.muted = false; // Bật tiếng
                video.play();
                playBtn.innerText = "✅ Đã Bật Tiếng";
            } else {
                alert("Bạn chưa bấm nút '1. Chọn Video' kìa!");
            }
        });

        // 3. Nhận diện hình carton
        target.addEventListener("targetFound", () => { 
            if (video.src) video.play(); 
        });
        target.addEventListener("targetLost", () => { 
            if (video.src) video.pause(); 
        });
    </script>
</body>
</html>
