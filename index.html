<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Video PC - Final Version</title>
    
    <!-- Thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
        }
        
        /* Bảng trạng thái góc trên */
        #status-bar { 
            position: fixed; 
            top: 15px; 
            left: 15px; 
            z-index: 9999; 
            background: rgba(0, 0, 0, 0.85); 
            color: #00ffcc; 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-weight: bold; 
            border: 2px solid #00ffcc; 
            font-size: 14px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Thanh nút bấm phía dưới */
        #ui-controls { 
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 9999; 
            display: flex; 
            gap: 15px; 
        }

        .btn { 
            background: #00ffcc; 
            color: #000; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer;
            transition: all 0.2s ease; 
            box-shadow: 0 4px 12px rgba(0,255,204,0.3);
        }

        .btn:hover {
            background: #ffffff; 
            transform: scale(1.05);
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="status-bar">🚀 Đang nạp Webcam & Thư viện AR...</div>
    
    <div id="ui-controls">
        <button class="btn" onclick="document.getElementById('file-input').click()">📂 Chọn Video Trên PC</button>
        <button class="btn" id="play-btn">🔊 Bật Âm Thanh</button>
        <input type="file" id="file-input" accept="video/*">
    </div>

    <!-- Thẻ Video phát AR -->
    <video id="ar-video" loop crossorigin="anonymous" playsinline style="display:none;"></video>

    <!-- Khung cảnh AR PC -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: false; antialias: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Nhóm đối tượng hiển thị khi quét trúng ảnh -->
        <a-entity mindar-image-target="targetIndex: 0" id="target">
            
            <!-- 1. Màn hình phát video AR -->
            <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0.01"></a-video>

            <!-- 2. Khung viền 3D màu xanh nổi lên báo hiệu -->
            <a-ring radius-inner="0.52" radius-outer="0.56" color="#00ffcc" material="side: double" position="0 0 0.02"></a-ring>

        </a-entity>

    </a-scene>

    <script>
        const video = document.getElementById('ar-video');
        const fileInput = document.getElementById('file-input');
        const playBtn = document.getElementById('play-btn');
        const status = document.getElementById('status-bar');
        const target = document.getElementById('target');
        const scene = document.querySelector('#ar-scene');

        // Ép vẽ lại khung hình (Fix lỗi đen webcam trên máy tính)
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 1000);
        });

        // Trạng thái sẵn sàng
        scene.addEventListener('loaded', () => {
            status.innerText = "✅ Webcam PC Sẵn Sàng! Hãy bấm '📂 Chọn Video Trên PC'.";
        });

        // Nạp file video từ máy tính
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                video.src = URL.createObjectURL(file);
                video.load();
                video.muted = true; // Tắt tiếng trước để trình duyệt cho phép tự chạy ngầm
                
                video.play().then(() => {
                    status.innerText = "✅ Đã nạp Video! Đưa hình vẽ trước Webcam Laptop/PC.";
                }).catch(err => {
                    status.innerText = "❌ Lỗi đọc file video!";
                });
            }
        };

        // Bật/tắt âm thanh
        playBtn.onclick = () => {
            if (video.src) {
                video.muted = false;
                video.play();
                status.innerText = "🔊 Đang phát đầy đủ Video & Âm thanh!";
            } else {
                alert("Bạn chưa chọn file Video từ máy tính!");
            }
        };

        // Khi Webcam soi trúng hình ảnh
        target.addEventListener("targetFound", () => { 
            if (video.src) {
                video.play();
                status.innerText = "🎯 BẮT TRÚNG HÌNH! Đang phát AR Video...";
            } else {
                status.innerText = "🎯 Bắt trúng hình! Nhưng bạn chưa chọn Video.";
            }
        });
        
        // Khi đưa ảnh ra xa / mất dấu
        target.addEventListener("targetLost", () => { 
            if (video.src) video.pause();
            status.innerText = "⚠️ Mất dấu hình - Giơ lại ảnh trước Webcam!";
        });
    </script>
</body>
</html>
