<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>AR Video - MindAR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        a-scene {
            position: fixed !important;
            left: 0;
            top: 0;
            width: 100vw !important;
            height: 100vh !important;
        }

        #instruction {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 99999;

            padding: 9px 16px;

            color: #00ffcc;
            background: rgba(0, 0, 0, 0.75);

            border: 1px solid #00ffcc;
            border-radius: 22px;

            font-family: Arial, sans-serif;
            font-size: 13px;

            white-space: nowrap;
        }

        #controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 20px;

            z-index: 100000;

            display: flex;
            justify-content: center;
            gap: 8px;
        }

        button {
            padding: 12px 16px;

            border: 1px solid #00ffcc;
            border-radius: 25px;

            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;

            font-size: 14px;
            font-weight: bold;
        }

        #video-file {
            display: none;
        }

        #ar-video {
            display: none;
        }
    </style>
</head>

<body>

    <div id="instruction">
        📸 Đang khởi động camera...
    </div>

    <div id="controls">

        <input
            id="video-file"
            type="file"
            accept="video/mp4,video/*">

        <button id="camera-button">
            📷 Mở Camera
        </button>

        <button id="choose-video">
            📂 Chọn Video
        </button>

        <button id="sound-button">
            🔊 Bật Tiếng
        </button>

    </div>

    <video
        id="ar-video"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="auto"
        style="display:none;">
    </video>


    <a-scene
        id="ar-scene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
            uiLoading: no;
            uiScanning: no;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights;
            antialias: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false">

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <a-entity
            id="image-target"
            mindar-image-target="targetIndex: 0">


            <!-- VIDEO BÁM TRỰC TIẾP LÊN TARGET -->

            <a-video
                id="ar-video-plane"
                src="#ar-video"
                width="1"
                height="0.5625"
                position="0 0 0.01"
                rotation="0 0 0"
                material="
                    shader: flat;
                    side: double;
                ">
            </a-video>


            <!-- VÒNG TRANG TRÍ -->

            <a-ring
                color="#00ffcc"
                radius-inner="0.57"
                radius-outer="0.59"
                position="0 0 0.02"
                material="
                    shader: flat;
                    transparent: true;
                    opacity: 0.9;
                "
                animation="
                    property: rotation;
                    to: 0 0 360;
                    loop: true;
                    dur: 4000;
                    easing: linear;
                ">
            </a-ring>

        </a-entity>

    </a-scene>


    <script>

        const scene =
            document.getElementById("ar-scene");

        const video =
            document.getElementById("ar-video");

        const target =
            document.getElementById("image-target");

        const instruction =
            document.getElementById("instruction");

        const cameraButton =
            document.getElementById("camera-button");

        const chooseButton =
            document.getElementById("choose-video");

        const videoFile =
            document.getElementById("video-file");

        const soundButton =
            document.getElementById("sound-button");


        let videoURL = null;

        let targetFound = false;

        let mindarStarted = false;


        /*
         * ==========================================
         * KIỂM TRA TRÌNH DUYỆT
         * ==========================================
         */

        function checkCameraSupport() {

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {

                instruction.textContent =
                    "❌ Trình duyệt không hỗ trợ camera";

                return false;
            }

            return true;
        }


        /*
         * ==========================================
         * KHỞI ĐỘNG MINDAR
         * ==========================================
         */

        async function startAR() {

            if (mindarStarted) {
                return;
            }

            if (!checkCameraSupport()) {
                return;
            }

            instruction.textContent =
                "📷 Đang mở camera...";

            try {

                const mindar =
                    scene.components["mindar-image"];

                if (!mindar) {

                    instruction.textContent =
                        "❌ MindAR chưa khởi tạo";

                    return;
                }


                await mindar.start();

                mindarStarted = true;

                instruction.textContent =
                    "📸 Rọi camera vào hình nhận dạng...";

                cameraButton.textContent =
                    "✅ Camera đang chạy";

            } catch (error) {

                console.error(
                    "MindAR start error:",
                    error
                );

                instruction.textContent =
                    "❌ Không mở được camera";

                cameraButton.textContent =
                    "📷 Thử lại Camera";

            }
        }


        /*
         * ==========================================
         * NÚT MỞ CAMERA
         * ==========================================
         */

        cameraButton.addEventListener(
            "click",
            function () {

                startAR();

            }
        );


        /*
         * ==========================================
         * KHI A-FRAME ĐÃ LOAD
         * ==========================================
         */

        scene.addEventListener(
            "loaded",
            function () {

                /*
                 * Cho MindAR tự khởi động trước.
                 * Nếu trình duyệt không cho tự động,
                 * người dùng bấm Mở Camera.
                 */

                setTimeout(
                    function () {

                        startAR();

                    },
                    300
                );

            }
        );


        /*
         * ==========================================
         * CHỌN VIDEO
         * ==========================================
         */

        chooseButton.addEventListener(
            "click",
            function () {

                videoFile.click();

            }
        );


        videoFile.addEventListener(
            "change",
            function (event) {

                const file =
                    event.target.files[0];

                if (!file) {
                    return;
                }


                if (videoURL) {

                    URL.revokeObjectURL(
                        videoURL
                    );

                }


                videoURL =
                    URL.createObjectURL(file);


                video.pause();

                video.src =
                    videoURL;

                video.muted = true;

                video.loop = true;

                video.playsInline = true;

                video.load();


                soundButton.textContent =
                    "🔊 Bật Tiếng";


                instruction.textContent =
                    "🎬 Đã chọn video - Rọi vào hình!";


                /*
                 * Nếu target đang được nhận diện
                 */

                if (targetFound) {

                    video.play().catch(
                        function (error) {

                            console.log(
                                "Video play:",
                                error
                            );

                        }
                    );

                }

            }
        );


        /*
         * ==========================================
         * ÂM THANH
         * ==========================================
         */

        soundButton.addEventListener(
            "click",
            function () {

                if (!video.src) {

                    instruction.textContent =
                        "📂 Hãy chọn video trước!";

                    return;
                }


                if (video.muted) {

                    video.muted = false;

                    soundButton.textContent =
                        "🔇 Tắt Tiếng";

                    video.play().catch(
                        function () {

                            video.muted = true;

                            soundButton.textContent =
                                "🔊 Bật Tiếng";

                        }
                    );

                } else {

                    video.muted = true;

                    soundButton.textContent =
                        "🔊 Bật Tiếng";

                }

            }
        );


        /*
         * ==========================================
         * BẮT ĐƯỢC HÌNH
         * ==========================================
         */

        target.addEventListener(
            "targetFound",
            function () {

                targetFound = true;

                instruction.textContent =
                    "🎯 Đã bắt được hình!";


                if (video.src) {

                    video.play().catch(
                        function (error) {

                            console.log(
                                "Video play:",
                                error
                            );

                        }
                    );

                }

            }
        );


        /*
         * ==========================================
         * MẤT HÌNH
         * ==========================================
         */

        target.addEventListener(
            "targetLost",
            function () {

                targetFound = false;

                video.pause();

                instruction.textContent =
                    "⚠️ Mất dấu - Rọi lại vào hình!";

            }
        );


        /*
         * ==========================================
         * DEBUG MINDAR
         * ==========================================
         */

        scene.addEventListener(
            "arReady",
            function () {

                console.log(
                    "MindAR camera READY"
                );

                instruction.textContent =
                    "📸 Rọi camera vào hình nhận dạng...";

            }
        );


        scene.addEventListener(
            "arError",
            function (event) {

                console.error(
                    "MindAR ERROR:",
                    event
                );

                instruction.textContent =
                    "❌ MindAR không khởi động được";

            }
        );

    </script>

</body>
</html>
