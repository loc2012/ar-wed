<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Khối 1 & 3: VR Split & Nhận Diện Màu Xanh</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* KHỐI 1 STATUS */
        #block1-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: #00ffcc;
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        #camera-feed {
            width: 100vw;
            height: 50vh;
            object-fit: cover;
            display: block;
        }

        /* KHỐI 3 UI */
        #block3-ui {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999;
        }

        #btn-vr {
            background: #00ffcc;
            color: #000;
            border: 2px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        #vr-wrapper {
            width: 100vw;
            height: 50vh;
            position: relative;
        }

        body.mode-vr-split #vr-wrapper {
            display: flex;
        }

        body.mode-vr-split .a-canvas,
        body.mode-vr-split video {
            width: 100vw !important;
            height: 50vh !important;
            left: 0 !important;
            object-fit: cover !important;
        }

        #right-eye-overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 99998;
            border-left: 2px solid #00ffcc;
            background: #000;
            overflow: hidden;
        }

        body.mode-vr-split #right-eye-overlay {
            display: block;
        }

        #right-eye-overlay iframe {
            width: 200%;
            height: 100%;
            border: none;
            margin-left: -100%;
            pointer-events: none;
        }

        /* NHẬN DIỆN MÀU XANH UI */
        #green-detection-canvas {
            display: none;
        }

        #red-dot {
            position: fixed;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: red;
            border: 4px solid white;
            box-shadow: 0 0 15px red, 0 0 30px red;
            transform: translate(-50%, -50%);
            z-index: 999999;
            display: none;
            pointer-events: none;
        }

        #green-status {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%);
            z-index: 999999;
            min-width: 260px;
            padding: 12px 18px;
            border-radius: 15px;
            background: rgba(0,0,0,.85);
            color: white;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #555;
            box-shadow: 0 0 15px rgba(0,0,0,.5);
        }
    </style>
</head>
<body>

    <!-- KHỐI 1 -->
    <div id="block1-status">📌 [KHỐI 1] Đang khởi động Camera Sau...</div>
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- KHỐI 3 VR -->
    <div id="block3-ui">
        <button id="btn-vr">🥽 Bật Chia Đôi VR</button>
    </div>

    <div id="vr-wrapper">
        <a-scene 
            id="ar-scene"
            mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
            embedded
            color-space="sRGB" 
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">
            
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.3 0.3 0.3"
                       animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
                </a-box>
            </a-entity>
        </a-scene>
    </div>

    <div id="right-eye-overlay"></div>

    <!-- ELEMENTS NHẬN DIỆN MÀU -->
    <canvas id="green-detection-canvas" width="320" height="240"></canvas>
    <div id="red-dot"></div>
    <div id="green-status">🔍 Đang tìm màu xanh...</div>

    <!-- SCRIPT KHỐI 1 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const videoEl = document.getElementById('camera-feed');
            const statusEl = document.getElementById('block1-status');

            const constraints = {
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 320 },
                    height: { ideal: 240 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoEl.srcObject = stream;
                    statusEl.innerText = "🟢 [KHỐI 1] CAMERA SAU HOẠT ĐỘNG TỐT!";
                    statusEl.style.borderColor = "#00ffcc";
                    statusEl.style.color = "#00ffcc";
                })
                .catch(function(err) {
                    console.error("Lỗi Camera Khối 1:", err);
                    statusEl.innerText = "🔴 [KHỐI 1] LỖI BẬT CAM: " + err.message;
                    statusEl.style.borderColor = "#ff3366";
                    statusEl.style.color = "#ff3366";
                });
        });
    </script>

    <!-- SCRIPT KHỐI 3: IFRAME VR SPLIT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnVR = document.getElementById("btn-vr");
            const eye2 = document.getElementById("right-eye-overlay");
            let isVR = false;

            btnVR.addEventListener("click", function () {
                isVR = !isVR;

                if (isVR) {
                    document.body.classList.add("mode-vr-split");
                    btnVR.innerText = "📱 Màn Hình Đơn";
                    btnVR.style.background = "#ff3366";
                    btnVR.style.borderColor = "#ff3366";
                    btnVR.style.color = "#fff";

                    eye2.innerHTML = `<iframe src="${window.location.href}"></iframe>`;
                } else {
                    document.body.classList.remove("mode-vr-split");
                    btnVR.innerText = "🥽 Bật Chia Đôi VR";
                    btnVR.style.background = "#00ffcc";
                    btnVR.style.borderColor = "#00ffcc";
                    btnVR.style.color = "#000";
                    eye2.innerHTML = "";
                }

                window.dispatchEvent(new Event('resize'));
            });
        });
    </script>

    <!-- SCRIPT KHỐI 3: NHẬN DIỆN MÀU XANH TỐI ƯU (320x240 Smooth) -->
    <script>
        const canvas = document.getElementById("green-detection-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const redDot = document.getElementById("red-dot");
        const greenStatus = document.getElementById("green-status");

        let cachedVideo = null;

        function findCameraVideo() {
            if (cachedVideo && cachedVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                return cachedVideo;
            }
            const videos = document.querySelectorAll("video");
            for (let i = 0; i < videos.length; i++) {
                if (videos[i].readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    cachedVideo = videos[i];
                    return cachedVideo;
                }
            }
            return null;
        }

        function isGreen(r, g, b) {
            const sum = r + g + b;
            if (sum < 12) return false;

            const greenRatio = g / (sum + 1);
            const redRatio = r / (sum + 1);
            const blueRatio = b / (sum + 1);

            const greenDominant = greenRatio > redRatio * 1.12 && greenRatio > blueRatio * 1.12;
            if (!greenDominant) return false;

            const greenIndex = (2 * g - r - b) / (sum + 1);
            const strongGreen = greenIndex > 0.55;
            if (!strongGreen) return false;

            const maxRGB = Math.max(r, g, b);
            const minRGB = Math.min(r, g, b);
            const chroma = maxRGB - minRGB;
            const enoughColorDifference = chroma >= 4;
            if (!enoughColorDifference) return false;

            const notYellow = g > r * 1.05;
            if (!notYellow) return false;

            return true;
        }

        function detectGreen() {
            const video = findCameraVideo();

            if (!video) {
                greenStatus.innerHTML = "⏳ Đang chờ camera MindAR...";
                requestAnimationFrame(detectGreen);
                return;
            }

            if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                requestAnimationFrame(detectGreen);
                return;
            }

            const w = 320;
            const h = 240;

            try {
                ctx.drawImage(video, 0, 0, w, h);
            } catch (error) {
                requestAnimationFrame(detectGreen);
                return;
            }

            let imageData;
            try {
                imageData = ctx.getImageData(0, 0, w, h);
            } catch (error) {
                requestAnimationFrame(detectGreen);
                return;
            }

            const data = imageData.data;
            let totalX = 0;
            let totalY = 0;
            let count = 0;

            for (let y = 0; y < h; y += 2) {
                for (let x = 0; x < w; x += 2) {
                    const i = (y * w + x) * 4;
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    if (isGreen(r, g, b)) {
                        totalX += x;
                        totalY += y;
                        count++;
                    }
                }
            }

            const MIN_GREEN_PIXELS = 300;

            if (count >= MIN_GREEN_PIXELS) {
                const centerX = totalX / count;
                const centerY = totalY / count;

                const screenX = (centerX / w) * window.innerWidth;
                const screenY = (centerY / h) * window.innerHeight;

                redDot.style.display = "block";
                redDot.style.left = screenX + "px";
                redDot.style.top = screenY + "px";

                greenStatus.innerHTML = "🟢 XANH ĐƯỢC PHÁT HIỆN<br>📍 X: " + Math.round(screenX) + " | Y: " + Math.round(screenY) + "<br>🔴 Chấm đỏ đang ở tâm vùng xanh";
                greenStatus.style.color = "#00ff66";
                greenStatus.style.borderColor = "#00ff66";
            } else {
                redDot.style.display = "none";
                greenStatus.innerHTML = "🔴 KHÔNG CÓ MÀU XANH";
                greenStatus.style.color = "#ff3366";
                greenStatus.style.borderColor = "#ff3366";
            }

            requestAnimationFrame(detectGreen);
        }

        window.addEventListener("load", function() {
            setTimeout(detectGreen, 500);
        });
    </script>

</body>
</html>
