<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR - Chia Đôi Màn Hình Chuẩn</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #instruction {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            border: 1px solid #00ffcc;
            text-align: center;
            font-size: 13px;
            pointer-events: none;
        }

        /* Khung chứa chia đôi */
        .split-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            z-index: 1;
        }

        /* Nửa bên trái */
        .split-left {
            width: 50vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            border-right: 1px solid #00ffcc;
        }

        /* Nửa bên phải (Mirror/Clone từ scene chính) */
        .split-right {
            width: 50vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Ép Canvas AR nằm vừa vào 2 nửa */
        .split-left a-scene {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            left: 0;
            top: 0;
        }

        .split-right-content {
            width: 100vw;
            height: 100vh;
            position: absolute;
            right: 0;
            top: 0;
            transform: scaleX(1); /* Clone giao diện */
        }
    </style>
</head>
<body>

    <div id="instruction">📸 Rọi camera vào hình vẽ...</div>

    <!-- Màn hình chính chứa Scene AR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
            <!-- Khối xoay 3D -->
            <a-box position="0 0 0.25" material="color: #00ffcc; wireframe: true" scale="0.4 0.4 0.4"
                   animation="property: rotation; to: 0 360 360; loop: true; dur: 4000; easing: linear">
            </a-box>
            <a-circle color="red" radius="0.08" position="0 0 0.01"></a-circle>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const instruction = document.getElementById("instruction");
            const target = document.getElementById("ar-target");

            // Xử lý tạo hiệu ứng Split Screen bằng cách nhân bản Canvas
            window.addEventListener("arReady", () => {
                const canvas = document.querySelector(".a-canvas");
                const video = document.querySelector("video");
                
                // Ép màn hình hiển thị nửa trái - nửa phải
                if (canvas) {
                    canvas.style.width = "50vw";
                    canvas.style.left = "0";
                }
            });

            if (target) {
                target.addEventListener("targetFound", function () {
                    instruction.textContent = "🎯 Đã bắt được hình!";
                });

                target.addEventListener("targetLost", function () {
                    instruction.textContent = "⚠️ Mất dấu - Rọi lại vào hình!";
                });
            }
        });
    </script>

</body>
</html>
