<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Debug Khai Báo HTML</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
        #btn-bar { padding: 15px; background: #222; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="btn-bar">
        <button onclick="document.getElementById('file-input').click()">📂 Chọn Video Test</button>
        <input type="file" id="file-input" accept="video/*" style="display:none">
    </div>

    <h3 id="status">Màn hình khung HTML đã lên!</h3>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                document.getElementById('status').innerText = "✅ Đã chọn file: " + e.target.files[0].name;
            }
        });
    </script>
</body>
</html>
